<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// EP011-touch — DEEP science slot + first HERO look (hero-v2). ~17,000 touch receptors in the hand; slip detection by vibration; reflex grip;
// robot hands with few sensors crush or drop the egg; gel e-skin where the whole surface is a sensor.
// Phrases: 0 hook | 1 למה קשה | 2 לא רק לחץ | 3 רטט | 4 להחליק | 5 המוח מהדק | 6 לפני ששמתם לב | 7 כמה חיישנים | 8 מוחצים | 9 מפילים | 10 עור | 11 ג'ל | 12 כולו חיישן | 13-14 follow
import {studio, THREE, COL, rng, sm, win, camKF, V} from '/engine/lib/core.js';
const st = await studio({
  look: 'hero', episode: 11, fog: .02,
  hookEnd: 5.4,
  hook: ['ביד שלכם יש', '17,000 <span class="pill">חיישני מגע</span>!'],
  // S: 0 hand + receptors | 1 egg slips: pressure / vibration / reflex | 2 robot gripper: crush / drop | 3 gel skin + touch map | 4 follow
  scenes: (A, B, END) => [0, A[2] - .25, A[7] - .25, A[10] - .25, A[13] - .25, END],
  chips: (A, B, S) => [
    {a: A[2], b: A[3] - .05, y: 330, c: '', h: '✋ לחץ'},
    {a: A[3], b: A[5] - .05, y: 330, c: 'org', h: '〰️ רטט = מתחיל להחליק'},
    {a: A[5], b: S[2], y: 330, c: 'grn', h: '⚡ המוח מהדק, לפני שהרגשתם'},
    {a: A[7], b: A[8] - .05, y: 330, c: 'pnk', h: '🤖 רק כמה חיישנים'},
    {a: A[8], b: S[3], y: 330, c: 'pnk', h: '🥚 מוחץ… או מפיל'},
    {a: A[11], b: S[4], y: 330, c: 'grn', h: '🧪 עור מג׳ל: כולו חיישן'},
  ],
});
const {scene, A, B, S, END} = st; const r = rng(11);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, roughness: .75, ...o});
st.stage({r: 160, grid: 0, spot: null});
const spot = (p, tg, pw = 22, reach = 9) => { const s = new THREE.SpotLight(0xffffff, pw, reach, .55, .7); s.position.set(...p); s.target.position.set(...tg); s.castShadow = true; s.shadow.mapSize.set(1024, 1024); scene.add(s, s.target); };

// ---------- stylised hand (primitives, matte lavender) ----------
const skin = M(0xc9c3f2, {roughness: .7});
function hand() {
  const g = new THREE.Group(); const parts = [];
  const palm = new THREE.Mesh(new THREE.BoxGeometry(.9, .22, 1.0), skin); palm.position.set(0, .0, 0); palm.castShadow = true; g.add(palm); parts.push(palm);
  const fingers = [];
  const F = [[-.33, .55, .9], [-.11, .6, 1.0], [.11, .58, .96], [.32, .52, .82]];
  F.forEach(([x, z, k]) => { const f = new THREE.Group(); f.position.set(x, 0, z - .1); g.add(f);
    const a = new THREE.Mesh(new THREE.CapsuleGeometry(.09, .36 * k, 6, 12), skin); a.rotation.x = Math.PI / 2; a.position.z = .22 * k; a.castShadow = true; f.add(a);
    const j = new THREE.Group(); j.position.z = .46 * k; f.add(j);
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(.085, .26 * k, 6, 12), skin); b.rotation.x = Math.PI / 2; b.position.z = .17 * k; b.castShadow = true; j.add(b);
    fingers.push({f, j, k}); parts.push(a, b); });
  const th = new THREE.Group(); th.position.set(.48, 0, -.1); th.rotation.y = -.9; g.add(th);
  const t1 = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .4, 6, 12), skin); t1.rotation.x = Math.PI / 2; t1.position.z = .25; t1.castShadow = true; th.add(t1); parts.push(t1);
  const wrist = new THREE.Mesh(new THREE.CylinderGeometry(.34, .38, .7, 24), skin); wrist.rotation.x = Math.PI / 2; wrist.position.z = -.6; wrist.scale.set(.8, .6, .8); wrist.castShadow = true; g.add(wrist);
  scene.add(g); return {g, fingers, th, parts};
}
// receptor dots sprinkled over the hand surface (dense on fingertips)
function dots(H, n) {
  const pts = [], tmp = new THREE.Vector3(); H.g.updateMatrixWorld(true);
  for (let i = 0; i < n; i++) {
    const tip = r() < .55; const fi = H.fingers[Math.floor(r() * 4)];
    let m = tip ? fi.j.children[0] : H.parts[Math.floor(r() * H.parts.length)];
    m.geometry.computeBoundingBox(); const bb = m.geometry.boundingBox;
    tmp.set(bb.min.x + r() * (bb.max.x - bb.min.x), bb.max.y + .004, bb.min.z + r() * (bb.max.z - bb.min.z));
    if (m.geometry.type === 'CapsuleGeometry') { const rad = .09; const a = (r() - .5) * 2.4; tmp.set(Math.sin(a) * rad * 1.15, bb.min.y + r() * (bb.max.y - bb.min.y), Math.cos(a) * rad * 1.15); }
    m.localToWorld(tmp); H.g.worldToLocal(tmp); pts.push(tmp.x, tmp.y, tmp.z, r());
  }
  const g = new THREE.BufferGeometry(); const P = [], O = [];
  for (let i = 0; i < pts.length; i += 4) { P.push(pts[i], pts[i + 1], pts[i + 2]); O.push(pts[i + 3]); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('ord', new THREE.Float32BufferAttribute(O, 1));
  const mat = new THREE.PointsMaterial({color: 0xe8338f, size: .045, transparent: true, depthWrite: false});
  mat.onBeforeCompile = sh => { sh.uniforms.reveal = mat.userData.reveal; sh.vertexShader = 'attribute float ord;\nvarying float vO;\nuniform float reveal;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvO = ord;');
    sh.fragmentShader = 'varying float vO;\nuniform float reveal;\n' + sh.fragmentShader.replace('#include <clipping_planes_fragment>', 'if (vO > reveal) discard;\n#include <clipping_planes_fragment>'); };
  mat.userData.reveal = {value: 0};
  const p = new THREE.Points(g, mat); H.g.add(p); return mat;
}
// --- set 1 (origin): hero hand, palm up, receptors light up
spot([-1.2, 3.2, 2.2], [0, 0, .2], 26, 9);
const H1 = hand(); H1.g.position.set(0, .9, 0); H1.g.rotation.set(-.3, -1.05, 0);
const D1 = dots(H1, 1600);
// --- set 2 (x = 20): hand holding an egg (pinch), the egg slips → ripples → fingers tighten
const X2 = 20; spot([X2 - 1.3, 3.2, 2.4], [X2, .8, 0], 26, 9);
const H2 = hand(); H2.g.position.set(X2, .9, 0); H2.g.rotation.set(-.2, -1.0, 0);
const eggM = M(0xf1e7d6, {roughness: .55});
const egg2 = new THREE.Mesh(new THREE.SphereGeometry(.2, 32, 20), eggM); egg2.scale.set(1, 1.28, 1); egg2.castShadow = true; scene.add(egg2);
const ripM = M(COL.orange, {roughness: .6, transparent: true, opacity: 0}); const rips = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.TorusGeometry(.1, .008, 6, 40), ripM); scene.add(m); return m; });
// --- set 3 (x = 40): simple two-finger robot gripper with 3 sensors, crushes an egg, then drops a second
const X3 = 40; spot([X3 - 1.2, 3.4, 2.4], [X3, .9, 0], 28, 10);
const metal = M(0x8c93b8, {roughness: .5}), dark = M(0x2a2d55);
const grip = new THREE.Group(); grip.position.set(X3, 1.6, 0); scene.add(grip);
const gb = new THREE.Mesh(new THREE.BoxGeometry(.7, .3, .4), metal); gb.castShadow = true; grip.add(gb);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, 1.6, 16), dark); arm.position.y = .9; grip.add(arm);
const jaws = [-1, 1].map(s => { const j = new THREE.Mesh(new THREE.BoxGeometry(.08, .55, .3), metal); j.position.set(s * .3, -.4, 0); j.castShadow = true; grip.add(j);
  const sen = new THREE.Mesh(new THREE.BoxGeometry(.02, .1, .1), M(COL.pink, {roughness: .5})); sen.position.set(-s * .05, -.15, 0); j.add(sen); return j; });
const egg3 = new THREE.Mesh(new THREE.SphereGeometry(.2, 32, 20), eggM.clone()); egg3.scale.set(1, 1.28, 1); egg3.castShadow = true; egg3.position.set(X3, 1.03, 0); scene.add(egg3);
const yolk = new THREE.Mesh(new THREE.CylinderGeometry(.35, .38, .02, 32), M(0xf2b33a, {roughness: .4})); yolk.position.set(X3, .01, 0); yolk.scale.setScalar(.01); scene.add(yolk);
const shells = Array.from({length: 7}, () => { const m = new THREE.Mesh(new THREE.DodecahedronGeometry(.06, 0), eggM); m.userData.v = V((r() - .5) * 1.6, r() * 1.2, (r() - .5) * 1.6); scene.add(m); m.visible = false; return m; });
const egg4 = new THREE.Mesh(new THREE.SphereGeometry(.2, 32, 20), eggM); egg4.scale.set(1, 1.28, 1); egg4.castShadow = true; scene.add(egg4);
// --- set 4 (x = 60): gel-skin hand holding an egg gently + tablet with the Hebrew touch map
const X4 = 60; spot([X4 - 1.3, 3.2, 2.4], [X4 + .3, .8, 0], 26, 9);
const H4 = hand(); H4.g.position.set(X4, .9, 0); H4.g.rotation.set(-.2, -1.0, 0);
const gel = new THREE.MeshStandardMaterial({color: 0xe8338f, roughness: .35, transparent: true, opacity: .0, depthWrite: false});
H4.parts.forEach(p => { const s = new THREE.Mesh(p.geometry, gel); s.scale.setScalar(1.12); p.add(s); });
const egg5 = new THREE.Mesh(new THREE.SphereGeometry(.2, 32, 20), eggM); egg5.scale.set(1, 1.28, 1); egg5.castShadow = true; scene.add(egg5);
const TK = {k: 0};
const tab = st.screen([1.1, 1.5], (c, t, W, Hh) => {
  c.fillStyle = '#f4f5fb'; c.fillRect(0, 0, W, Hh);
  c.fillStyle = '#12142e'; c.font = `700 ${W * .1}px Rubik`; c.fillText('מפת מגע', W * .92, Hh * .1);
  c.fillStyle = '#6b6f93'; c.font = `400 ${W * .06}px Rubik`; c.fillText('כל נקודה בעור מרגישה', W * .92, Hh * .16);
  const k = TK.k;
  for (let i = 0; i < 14; i++) for (let j = 0; j < 18; j++) { const x = W * .1 + i * W * .058, y = Hh * .22 + j * Hh * .036;
    const d = Math.hypot(i - 7, j - 9); const v = Math.max(0, 1 - d / 6) * k; c.fillStyle = `rgba(232,51,143,${.08 + v * .85})`; c.fillRect(x, y, W * .05, Hh * .03); }
  c.fillStyle = '#1f9e6a'; c.font = `700 ${W * .085}px Rubik`; c.fillText(k > .5 ? 'אחיזה עדינה ✓' : 'מחפש…', W * .92, Hh * .93);
}, {px: 900, light: .35});
tab.mesh.position.set(X4 - 1.9, 1.2, -.7); tab.mesh.rotation.y = .25; scene.add(tab.mesh);
const stand = new THREE.Mesh(new THREE.BoxGeometry(.2, 1.0, .1), M(0x2a2d55)); stand.position.set(X4 - 1.9, .45, -.8); scene.add(stand);

const pinch = (H, k) => H.fingers.forEach(({f, j}, i) => { f.rotation.x = -k * (.55 + i * .05); j.rotation.x = -k * .7; });
st.frame(t => {
  // set 1: receptors reveal + slow turn
  D1.userData.reveal.value = .35 + sm(0, 3.0, t) * .65; H1.g.rotation.y = -1.05 + Math.sin(t * .6) * .15; pinch(H1, .12 + Math.sin(t * 1.4) * .04);
  // set 2: pinch, slip (egg slides down a bit), ripples, re-grip
  const slip = sm(A[3] + .2, A[4] + .6, t) * (1 - sm(A[5] + .1, A[5] + .5, t) * .8);
  const tight = .3 + sm(A[5], A[5] + .35, t) * .3;
  pinch(H2, tight); H2.g.updateMatrixWorld(true);
  const tipW = H2.fingers[1].j.localToWorld(V(0, .1, .2));
  const mid = H2.g.localToWorld(V(0, .32, .45 + .25 * slip)); egg2.position.copy(mid).add(V(0, -.06 * slip, 0));
  ripM.opacity = .9 * win(t, A[3], A[5] + .4, .2);
  rips.forEach((m, i) => { const u = ((t * 1.6 + i / 3) % 1); m.scale.setScalar(.6 + u * 2.2); m.position.copy(tipW); m.lookAt(V(X2 + 2.4, 2.2, 3.0)); });
  // set 3: gripper closes too hard on egg3 → cracks; then egg4 slips out of a too-weak grip and falls
  const close = sm(S[2], A[8] + .2, t);
  const crushed = t > A[8] + .15;
  jaws.forEach((j, i) => { j.position.x = (i ? 1 : -1) * (.3 - close * (crushed ? .26 : .1)); });
  egg3.visible = !crushed || t >= A[9] - .1 ? !crushed : false;
  const cr = t - (A[8] + .15);
  shells.forEach(m => { m.visible = crushed && t < A[9]; if (m.visible) { const d = Math.min(cr, .6); m.position.set(X3 + m.userData.v.x * d, Math.max(.04, 1.0 + m.userData.v.y * d - 4.9 * d * d), m.userData.v.z * d); } });
  yolk.scale.setScalar(crushed ? sm(A[8] + .2, A[8] + .7, t) : .01); yolk.visible = t < A[9] || t >= A[9] + 999; if (t >= A[9]) yolk.visible = false;
  if (t >= A[9]) { jaws.forEach((j, i) => { j.position.x = (i ? 1 : -1) * .22; }); const d = Math.max(0, t - (A[9] + .3)); egg4.visible = true; egg4.position.set(X3, Math.max(.26, 1.03 - 4.9 * d * d), 0); egg4.rotation.z = d * 3; }
  else egg4.visible = false;
  // set 4: gel appears, gentle hold, touch map lights
  gel.opacity = .45 * sm(S[3], A[11] + .2, t); pinch(H4, .45); H4.g.updateMatrixWorld(true);
  egg5.position.copy(H4.g.localToWorld(V(0, .32, .45)));
  TK.k = sm(A[11], A[12] + .3, t); tab.update(t);

  let cp, ct;
  if (t < S[1]) [cp, ct] = camKF(t, [[0, [-1.2, 2.6, 3.4], [-.35, .8, .2]], [S[1], [-.6, 2.4, 3.3], [-.35, .85, .2]]]);                                   // hero hand + dots
  else if (t < S[2]) [cp, ct] = camKF(t, [[S[1], [X2 - 1.9, 2.3, 3.5], [X2 - .45, .95, .2]], [A[5], [X2 - 1.4, 2.0, 3.0], [X2 - .45, 1.0, .25]], [S[2], [X2 - 1.7, 2.2, 3.3], [X2 - .45, .95, .2]]]); // slip + reflex
  else if (t < S[3]) [cp, ct] = camKF(t, [[S[2], [X3 + 2.2, 2.0, 3.6], [X3, 1.0, 0]], [A[9], [X3 + 1.8, 1.6, 3.4], [X3, .8, 0]], [S[3], [X3 + 2.0, 1.4, 3.4], [X3, .6, 0]]]); // crush / drop
  else if (t < S[4]) [cp, ct] = camKF(t, [[S[3], [X4 - 2.0, 2.4, 4.4], [X4 - 1.1, .95, 0]], [S[4], [X4 - 1.5, 2.2, 4.0], [X4 - 1.05, 1.0, -.1]]]);       // gel skin + map
  else [cp, ct] = camKF(t, [[S[4], [-.4, 2.4, 3.2], [-.35, .85, .2]], [END, [-1.2, 2.6, 3.4], [-.35, .8, .2]]]);                                          // loop
  return {cp, ct, overlay: t2 => {
    if (t2 < S[1]) st.counter(540, 1150, '17,000', ' חיישנים', '#e8338f', Math.min(1, 1 - sm(S[1] - .3, S[1], t2)), 92);
    if (t2 > A[7] && t2 < A[8]) jaws.forEach(j => { const [x, y] = st.proj(j.localToWorld(V(0, -.15, 0))); st.tag(x, Math.max(y - 70, 650), 'חיישן', '#e8338f', win(t2, A[7], A[8])); });
  }};
});
st.ready();
</script></body></html>
