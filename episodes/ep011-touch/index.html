<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// EP011-touch — DEEP science slot + first HERO look (hero-v2). ~17,000 touch receptors in the hand; slip detection by vibration; reflex grip;
// robot hands with few sensors crush or drop the egg; gel e-skin where the whole surface is a sensor.
// Phrases: 0 hook | 1 למה קשה | 2 לא רק לחץ | 3 רטט | 4 להחליק | 5 המוח מהדק | 6 לפני ששמתם לב | 7 כמה חיישנים | 8 מוחצים | 9 מפילים | 10 עור | 11 ג'ל | 12 כולו חיישן | 13-14 follow
import {studio, THREE, COL, rng, sm, win, camPath, V} from '/engine/lib/core.js';
const st = await studio({
  look: 'hero', episode: 11, fog: .03,
  keys: ['חיישני', 'להרגיש', 'לחץ', 'רטט', 'מהדק', 'חיישנים', 'מוחצים', 'מפילים', 'עור', "ג'ל", 'חיישן'],
  hookEnd: 5.4,
  hook: ['ביד שלכם יש', '17,000 <span class="pill">חיישני מגע</span>!'],
  // S: 0 hand + receptors | 1 egg slips: pressure / vibration / reflex | 2 robot gripper: crush / drop | 3 gel skin + touch map | 4 follow
  scenes: (A, B, END) => [0, A[2] - .25, A[7] - .25, A[10] - .25, A[13] - .25, END],
  // no chips in the hero look: info lives in the scene (floating screen, callouts) like grouper
});
const {scene, A, B, S, END} = st; const r = rng(11);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, roughness: .75, ...o});
st.stage({r: 160, grid: 0, spot: null});
const spot = (p, tg, pw = 22, reach = 9) => { const s = new THREE.SpotLight(0xffffff, pw, reach, .55, .7); s.position.set(...p); s.target.position.set(...tg); s.castShadow = true; s.shadow.mapSize.set(1024, 1024); scene.add(s, s.target); };

// ---------- real hand (body/hand-right, MIT WebXR generic hand, media pro 2026-11-08) ----------
const ACC = 0x8ea6ff;
const eggM = M(0xf1e7d6, {roughness: .55});
const egg = (x, y, z, s = .8) => { const e = new THREE.Mesh(new THREE.SphereGeometry(.19 * s, 40, 28), eggM); e.scale.set(1, 1.3, 1); e.position.set(x, y, z); e.castShadow = true; scene.add(e); return e; };
async function hand({x = 0, y = 0, z = 0, s = 5, mat} = {}) {
  const m = await st.prop('body/hand-right', {tint: 1}); const o = m.object; o.scale.setScalar(s); o.position.set(x, y, z);
  const skinM = mat || M(0xc9c3f2, {roughness: .7});
  o.traverse(q => { if (q.isMesh) { q.material = skinM; q.castShadow = true; q.geometry.computeVertexNormals(); } });
  const bone = n => o.getObjectByName(n); const rest = {}; o.traverse(b => { if (b.isBone || /finger|thumb|wrist/.test(b.name)) rest[b.name] = b.quaternion.clone(); });
  const ax = new THREE.Vector3(1, 0, 0), q = new THREE.Quaternion();
  const curl = (f, k, joints) => joints.forEach(j => { const b = bone(`${f}-${j}`); if (!b) return; b.quaternion.copy(rest[b.name]).multiply(q.setFromAxisAngle(ax, k)); });
  const F = ['index-finger', 'middle-finger', 'ring-finger', 'pinky-finger'], J = ['phalanx-proximal', 'phalanx-intermediate', 'phalanx-distal'];
  let sk; o.traverse(q => { if (q.isSkinnedMesh) sk = q; });
  return {o, sk, mat: skinM, pose(k, pinch = 0) { F.forEach((f, i) => curl(f, k * (i ? 1 + i * .25 : 1 - pinch * .4), J)); curl('thumb', k * .6 + pinch * .3, ['phalanx-proximal', 'phalanx-distal']); }};
}
// receptor dots glued to the skinned surface (dense on fingertips), revealed in order
function receptors(H, all = false) {
  const pos = H.sk.geometry.attributes.position, si = H.sk.geometry.attributes.skinIndex, names = H.sk.skeleton.bones.map(b => b.name), out = [];
  const gT = new THREE.SphereGeometry(.0075, 8, 6), gB = new THREE.SphereGeometry(.0058, 8, 6), mT = M(ACC, {roughness: .5}), mB = M(0x6f86f0, {roughness: .5});
  for (let i = 0; i < pos.count; i++) { const tip = /distal|tip/.test(names[si.getX(i)] || ''); if (r() > (all ? .55 : tip ? .9 : .4)) continue;
    const d = new THREE.Mesh(tip ? gT : gB, tip ? mT : mB); d.userData.o = r(); scene.add(d); out.push([i, d]); }
  const v = new THREE.Vector3();
  return (reveal) => { H.o.updateMatrixWorld(true); for (const [i, d] of out) { v.fromBufferAttribute(pos, i); H.sk.applyBoneTransform(i, v); d.position.copy(v).applyMatrix4(H.sk.matrixWorld); d.visible = d.userData.o < reveal; } };
}
// --- set 1 (origin): open hand, palm up, 17,000 receptors light up
spot([-1, 3.2, 2.4], [0, .4, 0], 24);
const H1 = await hand({x: 0, y: .25, z: 0}); H1.o.rotation.set(-Math.PI / 2, 0, 0);
const R1 = receptors(H1); const R1g = receptors(H1, true);
// --- set 2 (x = 20): hand pinches an egg from above; the egg slips → ripples → fingers tighten
const X2 = 3.6; spot([X2 - 1.2, 3.2, 2.2], [X2, .3, 0], 22);
const H2 = await hand({x: X2 + .05, y: 1.05, z: .35}); H2.o.rotation.set(.35, Math.PI / 2, 0);
const egg2 = egg(X2 - .14, .7, .17);
// floating info screen above the hand (like grouper), dashed line down to the fingertip
const VB = {slip: 0, fix: 0};
const vib = st.screen([.7, .4], (c, t, W, Hh) => { c.fillStyle = '#10123a'; c.fillRect(0, 0, W, Hh); c.strokeStyle = 'rgba(142,166,255,.5)'; c.lineWidth = 6; c.strokeRect(3, 3, W - 6, Hh - 6);
  c.fillStyle = '#fff'; c.font = `700 ${Hh * .16}px Rubik`; c.fillText(VB.fix > .5 ? 'אחיזה מתוקנת ✓' : 'רטט באצבע', W * .93, Hh * .22);
  c.beginPath(); c.strokeStyle = VB.fix > .5 ? '#8ea6ff' : '#ffffff'; c.lineWidth = 7;
  for (let i = 0; i <= 120; i++) { const x = W * .06 + i / 120 * W * .88, ph = i / 120; const amp = VB.slip * Math.exp(-((ph - .6) ** 2) / .02) * Hh * .22; const y = Hh * .64 + Math.sin(i * 1.3 + t * 20) * amp; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke(); }, {px: 700, light: .5});
vib.mesh.position.set(X2 + .4, 1.22, -.8); scene.add(vib.mesh);
const dashG = new THREE.BufferGeometry().setFromPoints([V(X2 + .4, 1.02, -.8), V(X2 - .14, .92, .17)]); const dash = new THREE.Line(dashG, new THREE.LineDashedMaterial({color: 0xffffff, dashSize: .03, gapSize: .025, transparent: true})); dash.computeLineDistances(); scene.add(dash);
const ripM = M(ACC, {roughness: .6, transparent: true, opacity: 0}); const rips = [0, 1, 2].map(() => { const m = new THREE.Mesh(new THREE.TorusGeometry(.06, .005, 6, 40), ripM); scene.add(m); return m; });
// --- set 3 (x = 40): robot gripper (body/gripper, CC0) with a few sensors: crushes an egg, then drops a second
const X3 = 7.2; spot([X3 - 1.2, 3.2, 2.2], [X3, .4, 0], 24);
const Gp = await st.prop('body/gripper', {x: X3, y: .2, z: 0, scale: 3}); const G = Gp.object;
const jaws = ['A', 'B'].map(n => G.getObjectByName('jaw' + n)); const pads = ['A', 'B'].map(n => G.getObjectByName('pad' + n) || G.getObjectByName('jaw' + n));
const egg3 = egg(X3, .34, 0, .85);
const yolk = new THREE.Mesh(new THREE.CylinderGeometry(.22, .24, .015, 32), M(0xf2b33a, {roughness: .4})); yolk.position.set(X3, .01, .05); yolk.scale.setScalar(.01); scene.add(yolk);
const shells = Array.from({length: 7}, () => { const m = new THREE.Mesh(new THREE.DodecahedronGeometry(.04, 0), eggM); m.userData.v = V((r() - .5) * 1.2, r() * .9, (r() - .5) * 1.2); scene.add(m); m.visible = false; return m; });
const egg4 = egg(X3, .34, 0, .85);
// --- set 4 (x = 60): gel e-skin hand (whole surface = sensor) holds an egg gently + tablet with the Hebrew touch map
const X4 = 10.8; spot([X4 - 1.3, 3.2, 2.4], [X4 - .4, .5, 0], 26);
const gelM = M(0xc9c3f2, {roughness: .7});
const H4 = await hand({x: X4 + .05, y: 1.05, z: .35, mat: gelM}); H4.o.rotation.set(.35, Math.PI / 2, 0);
const egg5 = egg(X4 - .14, .7, .17);
const skinC = new THREE.Color(0xc9c3f2), gelC = new THREE.Color(0x5f7cff); const R4 = receptors(H4, true);
const TK = {k: 0};
const tab = st.screen([1.1, 1.5], (c, t, W, Hh) => {
  c.fillStyle = '#f4f5fb'; c.fillRect(0, 0, W, Hh);
  c.fillStyle = '#12142e'; c.font = `700 ${W * .1}px Rubik`; c.fillText('מפת מגע', W * .92, Hh * .1);
  c.fillStyle = '#6b6f93'; c.font = `400 ${W * .06}px Rubik`; c.fillText('כל נקודה בעור מרגישה', W * .92, Hh * .16);
  const k = TK.k;
  for (let i = 0; i < 14; i++) for (let j = 0; j < 18; j++) { const x = W * .1 + i * W * .058, y = Hh * .22 + j * Hh * .036;
    const d = Math.hypot(i - 7, j - 9); const v = Math.max(0, 1 - d / 6) * k; c.fillStyle = `rgba(142,166,255,${.08 + v * .85})`; c.fillRect(x, y, W * .05, Hh * .03); }
  c.fillStyle = '#1f9e6a'; c.font = `700 ${W * .085}px Rubik`; c.fillText(k > .5 ? 'אחיזה עדינה ✓' : 'מחפש…', W * .92, Hh * .93);
}, {px: 900, light: .35});
tab.mesh.scale.setScalar(.7); tab.mesh.position.set(X4 - .8, .85, -.8); tab.mesh.rotation.y = .35; scene.add(tab.mesh);
const stand = new THREE.Mesh(new THREE.BoxGeometry(.14, .5, .08), M(0x2a2d55)); stand.position.set(X4 - .8, .25, -.86); scene.add(stand);

st.frame(t => {
  // set 1: receptors reveal + gentle finger breathing
  H1.o.rotation.z = Math.sin(t * .6) * .12; H1.pose(.1 + Math.sin(t * 1.3) * .03); R1(t < S[1] ? .25 + sm(0, 3.0, t) * .75 : 1);
  // set 2: pinch, slip (egg slides down), ripples, re-grip
  const slip = sm(A[3] + .2, A[4] + .6, t) * (1 - sm(A[5] + .1, A[5] + .5, t) * .85);
  const tight = .3 + sm(A[5], A[5] + .35, t) * .2;
  H2.pose(tight, 1 - slip * .5); egg2.position.set(X2 - .14, .7 - .12 * slip, .17);
  ripM.opacity = .9 * win(t, A[3], A[5] + .4, .2);
  VB.slip = win(t, A[3], A[5] + .2, .2); VB.fix = sm(A[5], A[5] + .2, t); vib.update(t); dash.material.opacity = 1;
  rips.forEach((m, i) => { const u = ((t * 1.6 + i / 3) % 1); m.scale.setScalar(.6 + u * 2.2); m.position.set(X2 - .1, .86, .2); m.lookAt(V(X2 - 1.6, 1.5, 2.6)); });
  // set 3: gripper closes too hard on egg3 → cracks; then lifts egg4 with a weak grip and drops it
  const close = sm(S[2], A[8] + .2, t), crushed = t > A[8] + .15;
  if (t < A[9]) { G.position.y = .2; jaws.forEach((j, i) => { if (j) j.position.x = (i ? 1 : -1) * (.06 - close * (crushed ? .048 : .02)); }); }
  egg3.visible = !crushed && t < A[9];
  const cr = t - (A[8] + .15);
  shells.forEach(m => { m.visible = crushed && t < A[9]; if (m.visible) { const d = Math.min(cr, .6); m.position.set(X3 + m.userData.v.x * d, Math.max(.03, .34 + m.userData.v.y * d - 4.9 * d * d), m.userData.v.z * d); } });
  yolk.visible = crushed && t < A[9]; yolk.scale.setScalar(crushed ? sm(A[8] + .2, A[8] + .7, t) : .01);
  if (t >= A[9]) { jaws.forEach((j, i) => { if (j) j.position.x = (i ? 1 : -1) * .042; }); const lift = sm(A[9], A[9] + .5, t) * .55; G.position.y = .2 + lift;
    const d = Math.max(0, t - (A[9] + .55)); egg4.visible = true; egg4.position.set(X3, Math.max(.2, .34 + lift - 4.9 * d * d), 0); egg4.rotation.z = d * 2.5; }
  else egg4.visible = false;
  // set 4: hand turns into gel skin (light blue), gentle hold, touch map lights
  const g1 = sm(S[3] + .3, A[11], t); H1.mat.color.copy(skinC).lerp(gelC, g1); H1.mat.roughness = .7 - g1 * .4; R1g(t > S[3] && t < S[4] ? g1 : 0);
  const g = sm(S[3], A[11] + .2, t); gelM.color.copy(skinC).lerp(gelC, g); gelM.roughness = .7 - g * .4; H4.pose(.4, .8); R4(t > S[3] ? sm(A[11], A[12] + .2, t) : 0);
  TK.k = sm(A[11], A[12] + .3, t); tab.update(t);

  // one world, continuous camera (Ziv 2026-11-08, like grouper): fly from object to object, breathing zoom in/out, no scene cuts
  const sh = (tt, tg, off, z) => [tt, [tg[0] + off[0] * z, tg[1] + off[1] * z, tg[2] + off[2] * z], tg];
  const T1 = [.05, .24, .3], O1 = [-.6, 1.75, 1.6];
  const T2 = [X2 - .1, .9, -.1], O2 = [-1.0, 1.55, 2.2];
  const T3 = [X3, .62, 0], O3 = [-.8, 1.45, 2.0];
  const T4 = [X4 - .38, .75, -.2], O4 = [-.45, 1.75, 2.9];
  const m = (a, b) => (a + b) / 2;
  const [cp, ct] = camPath(t, [
    sh(0, T1, O1, 1.0), sh(m(0, S[1]), [.15, .25, .35], O1, .6), sh(S[1] - .1, T1, O1, 1.15),                                  // hand → fingertip close-up → out
    sh(S[1] + .35, T2, O2, 1.2), sh(A[4], T2, O2, .85), sh(A[5] + .3, [X2 - .14, .85, .1], O2, .78), sh(S[2] - .1, T2, O2, 1.05), // egg + floating screen → slip close-up
    sh(S[2] + .45, T3, O3, 1.25), sh(A[8] - .1, T3, O3, 1.0), sh(A[8] + .4, T3, O3, .75), sh(A[9] + .3, T3, O3, 1.05), sh(S[3] - .05, T3, O3, 1.2),       // dive into the gripper
    sh(S[3] + .45, T1, O1, 1.15), sh(S[3] + .75, T1, O1, 1.05), sh(A[11] - .1, T1, O1, .8),                                                                          // back to the first hand: it becomes gel
    sh(A[11] + .35, T4, O4, 1.1), sh(A[12] + .3, T4, O4, .85), sh(S[4] - .1, T4, O4, 1.0),                                     // gel hand holds the egg + touch map
    sh(S[4] + .5, T1, O1, 1.15), sh(END, T1, O1, 1.0)]);
  vib.mesh.lookAt(cp);
  return {cp, ct, noFlash: true, overlay: t2 => {
    if (t2 < S[1]) st.counter(540, 1150, '17,000', ' חיישנים', '#8ea6ff', Math.min(1, 1 - sm(S[1] - .3, S[1], t2)), 92);
    if (t2 > A[8] - .2 && t2 < A[9]) { const j = pads[0]; if (j) { const [x, y] = st.proj(j.localToWorld(V(0, 0, 0))); st.callout(x - 230, Math.max(y - 430, 600), 'רק כמה חיישנים', x, y, win(t2, A[8] - .2, A[9])); } }
    if (t2 > A[2] && t2 < A[3] + .2) { const [x, y] = st.proj(V(X2 - .1, .9, .2)); st.callout(x + 60, Math.max(y - 300, 620), 'לחץ', x, y, win(t2, A[2], A[3] + .2)); }
  }};
});
st.ready();
</script></body></html>
