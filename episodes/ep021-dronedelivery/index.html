<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// EP021-dronedelivery — LONG + hero look, one world = media's Tel-Aviv kit (fx-tlv.js). visual.md v1, hook moves approved by Ziv (ride the line looking down → over the drone).
// Phrases (aligned 2026-11-20): 0 המשלוח הבא שלכם | 1 יירד אליכם על חבל | 2 מגובה של מאה מטר | 3 למה לא נוחת? | 4 אין לו איפה | 5 עצים | 6 חוטי חשמל | 7 ואנשים
// 8 נשאר גבוה | 9 ומוריד חבל | 10 החלק המטורף | 11 אין רק חבילה | 12 יש רובוט קטן | 13 מדחפים משלו | 14 מכוון את עצמו | 15 לשולחן בחצר
// 16 משאיר את החבילה | 17 החבל נגלל | 18 בדרך למשלוח הבא | 19 בלי לצלצל בפעמון | 20 עוד הסברים | 21 תעקבו
import {studio, THREE, sm, win, camPath, V} from '/engine/lib/core.js';
import {tlvCity, tether, podDoors} from '/engine/props/fx-tlv.js';
const st = await studio({
  look: 'hero', episode: 21, fog: .0016, outro: 'card',
  keys: ['חבל', 'מאה', 'נוחת', 'עצים', 'חשמל', 'גבוה', 'רובוט', 'מדחפים', 'בדיוק', 'לשולחן', 'נגלל', 'בפעמון'],
  hookEnd: 4.0, hook: ['ככה יגיעו משלוחים', 'ל<span class="pill">תל אביב</span>?'],
  scenes: (A, B, END) => [0, END],
});
const {scene, A, B, END} = st;
const ACC = 0x8ea6ff, FORCE = 0x4f6fe0;
st.stage({r: 900, grid: 0, spot: null});
const sun = new THREE.DirectionalLight(0xdfe3ff, 1.15); sun.position.set(-120, 220, 90); sun.castShadow = true; Object.assign(sun.shadow.camera, {left: -140, right: 140, top: 140, bottom: -140, near: 1, far: 600});
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; scene.add(sun, sun.target);
const city = await tlvCity(st, {cols: 4, rows: 4, hero: {col: 1, row: 1, slot: 1}, boulevardAfter: 1});
const spot = city.heroSpot, V3 = () => new THREE.Vector3();
const man = (await st.prop('people/mannequin-reach', {x: spot.x, y: spot.y, z: spot.z, ry: .6, tint: 1})).object;
man.updateMatrixWorld(true); const H = man.getObjectByName('handR').getWorldPosition(V3());
{ const u = city.hero.getObjectByName('umbrella'); if (u) u.visible = false; }
const table = city.hero.getObjectByName('table'), T = table.getWorldPosition(V3()); T.y += .02 + new THREE.Box3().setFromObject(table).max.y - table.getWorldPosition(V3()).y;
const door = city.hero.getObjectByName('roofDoor'), D = door.getWorldPosition(V3());
const dr = (await st.model('drone/winchDrone')).object; scene.add(dr);

const parcel = pod.getObjectByName('parcel');
// street spot for "why not land" (east street of the hero cell), wires + people there
const S = V(32, 0, H.z + 6);
const ghost = (await st.model('drone/winchDrone')).object; ghost.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .35; o.castShadow = false; } }); scene.add(ghost);
const poleM = new THREE.MeshStandardMaterial({color: 0x4750a8, roughness: .8}), wireM = new THREE.LineBasicMaterial({color: 0xb9bdf0});
const poles = [-14, 0, 14].map(dz => { const p = new THREE.Mesh(new THREE.CylinderGeometry(.12, .16, 9, 8), poleM); p.position.set(S.x + 5, 4.5, S.z + dz); p.castShadow = true; scene.add(p); return p; });
for (const dy of [8.6, 8.0]) for (let i = 0; i < 2; i++) { const a = poles[i].position, b = poles[i + 1].position, pts = [];
  for (let k = 0; k <= 20; k++) { const u = k / 20; pts.push(V(a.x + (dy === 8 ? .4 : -.4), dy - Math.sin(u * Math.PI) * .7, a.z + (b.z - a.z) * u)); }
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, .045, 6), new THREE.MeshStandardMaterial({color: 0xb9bdf0, roughness: .6}))); }
const people = []; for (const [dx, dz, ry] of [[0, -6, .4], [1.6, -3.2, 2.8], [-1.2, -.5, -1.2]]) people.push((await st.prop('people/mannequin-walk', {x: S.x + dx, z: S.z + dz, ry, h: 1.7, tint: 1})).object);
// target ring on the terrace table, ✕ ring on the street
const ringM = (col) => new THREE.MeshStandardMaterial({color: col, roughness: .6, transparent: true, side: THREE.DoubleSide});
const tRing = new THREE.Mesh(new THREE.RingGeometry(.28, .34, 48), ringM(ACC)); tRing.rotation.x = -Math.PI / 2; tRing.position.copy(T).add(V(0, .01, 0)); scene.add(tRing);
const xRing = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.5, 64), ringM(ACC)); xRing.rotation.x = -Math.PI / 2; xRing.position.set(S.x, .06, S.z); scene.add(xRing);
// fan discs on the pod (deeper blue = force) for "מדחפים משלו"
const fans = [0, 1, 2, 3].map(i => { const f = pod.getObjectByName('fan' + i) || pod.getObjectByName('rotor' + i); const m = new THREE.Mesh(new THREE.CircleGeometry(.09, 24), new THREE.MeshStandardMaterial({color: FORCE, roughness: .5, transparent: true, opacity: 0, side: THREE.DoubleSide})); m.rotation.x = -Math.PI / 2; m.position.y = .01; f && f.add(m); return m; });
const HOV = 100.4;                                           // drone height above the hand
st.frame(t => {
  city.sea && city.sea.update(t);
  // ---------- drone + line + pod ----------
  // hook (0–A3): pod already at the hand, full line. Story (A8→): line goes out from the drone (8–9), pod rides down (10–12), steers to the table (13–15),
  // drops the parcel (16), reels up (17), drone flies on (18), back above for the outro.
  const off = V(0, 0, 0);
  const fly = sm(A[18], B[18], t) * (1 - sm(A[19], A[20] - .15, t));   // back in place before the outro cut (it zipped into frame at 29.9 s)
  dr.position.set(H.x + 40 * fly, H.y + HOV + 4 * fly, H.z - 25 * fly); dr.rotation.y = t * .05; dr.rotation.z = -.12 * win(t, A[18], B[18], .5);
  for (let i = 0; i < 6; i++) { const p = dr.getObjectByName('prop' + i); if (p) p.rotation.y = t * 40 * (i % 2 ? -1 : 1); }
  let len;
  if (t < A[8]) len = HOV - .9;                                                               // hook (and the "why not land" detour)
  else if (t < A[16]) len = 2 + (HOV - 1.6) * sm(A[8] + .2, B[12], t);                       // out from the drone, pod comes down to the terrace
  else len = (HOV - .3) * (1 - sm(A[17], B[17] + .3, t)) + .9;                                // reel up
  const sway = 1 - .85 * sm(A[13] - .6, A[13] + .4, t);   // smooth (was a step → pod + camera jumped at 17.9 s)
  teth.set(Math.max(.9, len), t, sway);
  // steer: from straight under the drone to the table (13–15), stay there until the reel-up
  const steer = sm(A[13] + .3, B[15], t) * (1 - sm(A[17], A[17] + .4, t));
  const above = pod.position.clone(), tgt = T.clone().add(V(0, .55 - .27 * sm(A[15], B[15], t), 0));
  if (t >= A[8]) { const k = steer; pod.position.lerp(V(tgt.x, Math.max(tgt.y, pod.position.y), tgt.z), k); }   // no snap (jump at 22.3 s)
  if (t < A[3]) pod.position.copy(H.clone().add(V(0, .55 - .1 * sm(0, 3, t), 0)));                                   // hook: hovering just above the hand
  // re-aim the line to the pod's real position
  { dr.updateMatrixWorld(true); const a = dr.getObjectByName('lineOut').getWorldPosition(V3()), e = pod.position.clone().add(V(0, .35, 0)), L = teth.line;
    L.position.copy(a).lerp(e, .5); L.scale.set(1, Math.max(.001, a.distanceTo(e)), 1); L.quaternion.setFromUnitVectors(V(0, 1, 0), a.clone().sub(e).normalize()); }
  doors.set(sm(A[16], A[16] + .4, t) * (1 - sm(A[17] + .2, A[17] + .6, t)), .5 * sm(A[16] + .3, A[16] + .7, t) * (t < A[17] + .2 ? 1 : 0));
  // parcel stays on the table after the drop
  if (t > A[16] + .7) { if (parcel.parent === pod) { scene.attach(parcel); } parcel.position.set(T.x, T.y + .12, T.z); } else if (parcel.parent !== pod) pod.attach(parcel);
  fans.forEach(f => f.material.opacity = .8 * win(t, A[13], B[15] + .3, .3));
  tRing.material.opacity = .9 * win(t, A[14], A[17], .3); tRing.scale.setScalar(1 + .15 * Math.sin(t * 6) * win(t, A[14], B[15], .2));
  // ghost drone trying to land on the street (3–4) + ✕ ring
  const gk = sm(A[3] + .2, A[4] + .3, t); ghost.visible = t > A[3] && t < A[5]; ghost.position.set(S.x, 30 - 26 * gk, S.z); ghost.rotation.y = t * .05;
  xRing.material.opacity = .9 * win(t, A[4], A[8], .3);
  // ---------- camera ----------
  const sh = (tt, tg, o, z = 1) => [tt, [tg[0] + o[0] * z, tg[1] + o[1] * z, tg[2] + o[2] * z], tg];
  let cp, ct;
  const up = sm(.8, B[2] - .3, t), over = sm(B[2] - .55, A[3] + .1, t);
  if (t < A[3] + .1) {                                        // HOOK v3 (Ziv 2026-11-20): start over the drone, ride DOWN the line looking down, land at the hand + pod on the terrace; counter 100 → 0
    const dn = sm(.5, B[2] - .2, t), land = sm(B[2] - .45, A[3] + .1, t);
    const ty = H.y + HOV - 1.5 - (HOV - 2.4) * dn;
    const ride = V(H.x + .55, ty + .3, H.z + .4), rideT = pod.position.clone();
    const top0 = V(H.x + 5.5, H.y + HOV + 5.5, H.z + .6), topT = dr.position.clone().add(V(-4, -3, 0));   // look west: sea + beach in the frame (Tel Aviv)
    const end = V(H.x + 2.6, H.y + 1.6, H.z + 2.0), endT = V(H.x, H.y + .3, H.z), k0 = sm(.15, .6, t);
    cp = top0.clone().lerp(ride, k0).lerp(end, land); ct = topT.clone().lerp(rideT, k0).lerp(endT, land);
  } else {
    const Dp = dr.position, Pp = pod.position, Ss = [S.x, 2, S.z];
    [cp, ct] = camPath(t, [
      sh(A[3] + .1, [S.x, 8, S.z], [33, 43, 33]),   // clean cut terrace → street (was a 30 m whip at 5 s)
      sh(A[3] + 1.0, [S.x, 8, S.z], [30, 40, 30]), sh(A[4] + .2, [S.x, 4, S.z - .5], [11, 8, 15.5]),                 // dive: ghost tries to land, ✕
      sh(A[5] - .25, [S.x, 4, S.z - 1], [9, 6, 13]), sh(B[7], [S.x + 1, 3, S.z - 2], [7, 4.5, 10.5]),   // ONE slow shot: trees + wires + people all in frame, callouts pop on each word (Ziv: sync, no whips)
      sh(END + 5, [S.x + 1, 3, S.z - 2], [6.8, 4.4, 10.2])]);
    // Ziv 2026-11-20: close-ups on each word (trees / wires / people), clean cut on the word, slow push-in while it's spoken
    const cu = (t0, t1, tg, o0, o1) => { if (t >= t0 && t < t1) { const k = sm(t0, t1, t); ct = V(...tg); cp = V(tg[0] + o0[0] + (o1[0] - o0[0]) * k, tg[1] + o0[1] + (o1[1] - o0[1]) * k, tg[2] + o0[2] + (o1[2] - o0[2]) * k); } };
    cu(A[5] - .1, A[6] - .1, [S.x - 4, 4, S.z - 2], [5, 4, 8], [3.8, 3.2, 6.2]);
    cu(A[6] - .1, A[7] - .1, [S.x + 5, 8, S.z], [-6, 1.5, 7], [-4.6, 1.2, 5.4]);
    cu(A[7] - .1, B[7] + .05, [S.x, 1.0, S.z - 3], [5, 3, 7], [3.8, 2.4, 5.6]);
    if (t > B[7] + .05) [cp, ct] = camPath(t, [   // clean cut street → drone (was a 100 m whip at 10.4 s)
      sh(B[7] + .05, [Dp.x, Dp.y - 2, Dp.z], [4.4, 3.3, 5.5]),
      sh(A[8] + .3, [Dp.x, Dp.y - 2, Dp.z], [4, 3, 5]), sh(B[9], [Pp.x, Pp.y + 1, Pp.z], [3, 3, 4]),   // follow the pod already (was a 30 m leap at 13 s)            // back up: drone lets the line out
      sh(A[10] + .3, [Pp.x, Pp.y, Pp.z], [1.4, 1.2, 1.8]), sh(A[11] + .4, [Pp.x, Pp.y, Pp.z], [1.1, .8, 1.4]),  // re-hook: follow the pod down
      sh(A[12] + .2, [Pp.x, Pp.y, Pp.z], [.9, .5, 1.1]), sh(A[13] + .1, [Pp.x, Pp.y, Pp.z], [1.0, .9, 1.2]),
      sh(A[14] + .3, [T.x, T.y + .6, T.z], [2.4, 1.8, 2.8]), sh(B[15], [T.x, T.y + .4, T.z], [1.8, 1.3, 2.2]),  // steering to the table
      sh(A[16] + .3, [T.x, T.y + .3, T.z], [1.6, 1.2, 2.0]),
      sh(A[17] + .3, [T.x, T.y + 3, T.z], [5, 4, 7]), sh(B[17], [T.x, T.y + 12, T.z], [14, 6, 18]),   // wider so the fast reel-up doesn't shake (25 s)                // reel up, follow
      sh(A[18] + .2, [Dp.x, Dp.y, Dp.z], [10, 6, 14]), sh(B[18], [Dp.x, Dp.y - 20, Dp.z], [30, 30, 40]),          // drone flies off over the roofs
      sh(A[19] + .1, [D.x, D.y + 1.2, D.z], [3, 1.5, 4]), sh(B[19], [D.x, D.y + 1.2, D.z], [2.4, 1.3, 3.4]), sh(END, [D.x, D.y + 1.2, D.z], [2.2, 1.2, 3.2])]);
    if (t > A[19] - .05 && t <= A[20] - .05) { const k = sm(A[19] - .05, A[20], t); cp = V(D.x + 3 - .6 * k, D.y + 2.7 - .2 * k, D.z + 4 - .6 * k); ct = V(D.x, D.y + 1.2, D.z); }   // clean cut to the door (was a 40 m whip at 27.9 s)
    if (t > A[20] - .05) { const k = sm(A[20] - .05, END, t); cp = V(H.x + 5.5 + .1 * k, H.y + HOV + 5.5 + .1 * k, H.z + .6); ct = V(H.x - 4, H.y + HOV - 3, H.z); }   // clean cut to the outro (was a 100 m whip in 0.3 s at 29.9 s)
  }
  const h = Math.round(100 * (1 - sm(.5, B[2] - .2, t)));
  return {cp, ct, noFlash: true, overlay: t2 => {
    const c = st.ctx;
    c.save(); c.fillStyle = 'rgba(10,12,40,.16)'; c.fillRect(0, 0, 1080, 1920); c.restore();   // QA glare fix: white Bauhaus roofs too bright (whole episode, matte dim)
    // height counter (hook)
    const ca = sm(.3, .7, t2) * (1 - sm(A[3] - .2, A[3] + .2, t2));
    if (ca > .01) { c.save(); c.globalAlpha = ca; const X = 900, Y = 1050; c.strokeStyle = '#8ea6ff'; c.lineWidth = 6; c.beginPath(); c.moveTo(X, Y - 380); c.lineTo(X, Y); c.stroke();
      const yy = Y - 380 * h / 100; c.fillStyle = '#8ea6ff'; c.beginPath(); c.arc(X, yy, 14, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.font = '900 64px Rubik'; c.textAlign = 'right'; c.direction = 'rtl'; c.fillText(h + ' מ׳', X - 30, yy + 22); c.restore(); }
    // ✕ on the street spot

      c.beginPath(); c.moveTo(x - 60, y - 60); c.lineTo(x + 60, y + 60); c.moveTo(x + 60, y - 60); c.lineTo(x - 60, y + 60); c.stroke(); c.restore(); } }
    const L = (a, b, lab, p, dx, dy) => { if (t2 > a && t2 < b) { const [x, y, z] = st.proj(p); if (z < 1) st.callout(Math.min(900, Math.max(180, x + dx)), Math.min(1150, Math.max(420, y + dy)), lab, x, y, win(t2, a, b, .25)); } };
    L(A[5] - .05, A[6] - .1, 'עצים', V(S.x - 4, 5, S.z - 2), 120, -260);
    L(A[6] - .05, A[7] - .1, 'חוטי חשמל', V(S.x + 5, 8.3, S.z + 7), -120, -240);
    L(A[7] - .05, A[8], 'אנשים', people[0].getWorldPosition(V3()).add(V(0, 1.8, 0)), 100, -240);
    L(A[12], A[13] + .2, 'רובוט', pod.position, 140, -260);
    L(A[13] + .2, A[14] + .3, 'מדחפים', pod.position, -160, -240);
    L(A[19], A[20], '🔔 אף אחד לא צלצל', D.clone().add(V(0, 1.2, 0)), 0, -260);
  }};
});
st.ready();
