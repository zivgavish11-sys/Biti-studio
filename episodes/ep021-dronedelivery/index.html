<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// EP021-dronedelivery — hook draft (Ziv: visual hook 1 "the endless line"). Timeline ESTIMATED.
// frame 0: hand up on a Tel-Aviv rooftop, parcel hanging just above it on a thin line going out of frame; camera rises along the line, counter 0 → 100 m, the drone is revealed.
import {studio, THREE, sm, camPath, V} from '/engine/lib/core.js';
import {varyCity} from '/engine/props/fx-city.js';
const st = await studio({
  look: 'hero', episode: 21, fog: .002, outro: 'card',
  keys: ['חבל', 'מאה'],
  hookEnd: 3.4, hook: ['המשלוח הבא שלכם', 'על <span class="pill">חבל</span>'],
  scenes: (A, B, END) => [0, END],
});
const {scene, A, B, END} = st;
st.stage({r: 160, grid: 0, spot: [4, 30, 6], target: [0, 10, 0]});
const P = async (n, o = {}) => (await st.prop(n, {tint: 1, ...o})).object;
await P('citycorner/streetCorner', {x: 0, z: 0});
const bau = await P('citycorner/bauhausCorner', {x: 13.25, z: -13.25}); try { varyCity(bau, 1921); } catch (e) {}
const sf = await P('citycorner/storefront', {x: -10, z: -13}); try { varyCity(sf, 1922); } catch (e) {}
const cf = await P('citycorner/cafe', {x: -12, z: 12, ry: Math.PI}); try { varyCity(cf, 1923); } catch (e) {}
// Tel-Aviv neighbourhood (Ziv 2026-11-20): dense Bauhaus blocks on a street grid, a tree boulevard, and the sea + beach + promenade palms on the west
{ let sd = 21; const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280; const kinds = ['citycorner/bauhausCorner', 'citycorner/storefront', 'citycorner/cafe'];
  for (let gx = -33; gx <= 77; gx += 22) for (let gz = -77; gz <= 55; gz += 22) {
    if (Math.abs(gx) < 12 && Math.abs(gz) < 12) continue; if (Math.abs(gx - 11) < 12 && Math.abs(gz + 11) < 12) continue;
    const o = await P(kinds[Math.floor(rnd() * 3)], {x: gx + (rnd() - .5) * 2, z: gz + (rnd() - .5) * 2, ry: Math.floor(rnd() * 4) * Math.PI / 2}); try { varyCity(o, 1900 + gx * 7 + gz); } catch (e) {} }
  for (let x = -40; x <= 85; x += 7) for (const z of [-33.5, -28.5]) await P('outdoor/CommonTree_1', {x: x + rnd(), z, h: 6 + rnd() * 1.5});   // boulevard
  const flat = (w, d, x, z, y, col) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({color: col, roughness: .9})); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m; };
  flat(14, 400, -51, -10, .03, 0x7e80c4);            // beach
  const sea = flat(300, 400, -208, -10, .02, 0x2b3a9c);  // sea (deeper blue)
  for (let k = 0; k < 9; k++) flat(1.2, 400, -60 - k * 9, -10, .04, 0x4f6fe0).material.opacity = .55;   // gentle wave lines
  for (let z = -90; z <= 70; z += 9) await P('outdoor/PalmTree_1', {x: -44, z: z + rnd() * 2, h: 7 + rnd() * 2});   // promenade
}
// hero palette (Ziv 2026-11-20: "חרגת מההגדרות"): everything monochrome indigo by brightness, textures off; only the accent stays light blue
const IND = [new THREE.Color(0x262c66), new THREE.Color(0x4750a8), new THREE.Color(0x6d74c4), new THREE.Color(0xb9bdf0)];
const indigo = (root, keep = () => false) => root.traverse(o => { if (!o.isMesh || keep(o)) return; const ms = Array.isArray(o.material) ? o.material : [o.material];
  o.material = ms.map(m => { const c = (m.color || new THREE.Color(1, 1, 1)).clone(); let l = c.r * .3 + c.g * .55 + c.b * .15; if (m.map) l = Math.max(l, .45);
    const i = Math.min(2.999, l * 3.4), a = Math.floor(i); const col = IND[a].clone().lerp(IND[a + 1], i - a);
    return new THREE.MeshStandardMaterial({color: col, roughness: .85, metalness: 0, transparent: m.transparent, opacity: m.opacity}); });
  if (o.material.length === 1) o.material = o.material[0]; });
scene.children.forEach(o => { if (o.isMesh && o.geometry && o.geometry.type === 'CircleGeometry') return; if (o.type === 'Group' || o.type === 'Object3D') indigo(o); });
const top = new THREE.Box3().setFromObject(bau).max.y;
// person on the rooftop, arm up
const man = await P('people/mannequin-walk', {x: 11.5, y: top, z: -11.5, ry: -2.3});
const M = n => man.getObjectByName(n);
// drone 100 m above the parcel
const dd = await P('drone/deliveryDrone', {scale: 1.2});
const parcel = dd.getObjectByName('parcel'), teth = dd.getObjectByName('tether');
if (teth) teth.visible = false;
scene.attach(parcel);
indigo(dd);
// parcel: plain light box + light-blue band (accent), no coloured groceries
parcel.traverse(o => { if (!o.isMesh) return; const n = o.name + (o.parent ? o.parent.name : '');
  if (/band/.test(n)) o.material = new THREE.MeshStandardMaterial({color: 0x8ea6ff, roughness: .7});
  else if (/box/.test(n)) o.material = new THREE.MeshStandardMaterial({color: 0xd9dbf5, roughness: .85});
  else o.visible = false; });
const line = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, 1, 6), new THREE.MeshStandardMaterial({color: 0xe8ecff, roughness: .5})); scene.add(line);
const V3 = () => new THREE.Vector3();
st.frame(t => {
  M('shoulderR').rotation.set(-2.9, 0, -.1); M('elbowR').rotation.x = -.15; M('head').rotation.x = -.5;
  man.updateMatrixWorld(true);
  const hand = (M('handR') || M('elbowR')).getWorldPosition(V3());
  const sway = Math.sin(t * 2.2) * .03;
  parcel.position.set(hand.x + sway, hand.y + .55 - .12 * sm(0, 3, t), hand.z); parcel.rotation.y = t * .3;
  const dy = 100; dd.position.set(hand.x, hand.y + dy, hand.z); dd.rotation.y = t * .15;
  const d = dd.getObjectByName('drone'); for (let i = 0; i < 4; i++) { const p = dd.getObjectByName('prop' + i); if (p) p.rotation.y = t * 40 * (i % 2 ? -1 : 1); }
  const p0 = parcel.position.clone().add(V(0, .25, 0)), p1 = dd.position.clone().add(V(0, -.3, 0));
  line.position.copy(p0).lerp(p1, .5); line.scale.set(1, p0.distanceTo(p1), 1);
  // camera (Ziv 2026-11-20): runs tight along the line, then climbs over the drone and looks down
  const up = sm(.8, 3.0, t), over = sm(2.75, 3.6, t);
  const ty = hand.y + .6 + (dy - 2.2) * up;
  const ride = V(hand.x + .55, ty + .3, hand.z + .4);                        // ~1 m beside the line
  const rideT = parcel.position.clone();                                       // Ziv: look DOWN the line at the parcel + person shrinking below
  const top0 = V(hand.x + 2.2, hand.y + dy + 5.2, hand.z + 1.8), topT = dd.position.clone().add(V(0, -.9, 0));
  const start = V(hand.x + 2.6, hand.y + 1.6, hand.z + 2.0), startT = V(hand.x, hand.y + .3, hand.z);
  const k0 = sm(.5, 1.0, t);
  const cpv = start.clone().lerp(ride, k0).lerp(top0, over), ctv = startT.clone().lerp(rideT, k0).lerp(topT, over);
  const h = Math.round(100 * sm(.8, 3.0, t));
  return {cp: cpv, ct: ctv, noFlash: true, overlay: t2 => {
    const c = st.ctx; c.save(); c.globalAlpha = sm(.3, .7, t2);
    const X = 900, Y = 1050; c.strokeStyle = '#8ea6ff'; c.lineWidth = 6; c.beginPath(); c.moveTo(X, Y - 380); c.lineTo(X, Y); c.stroke();
    const yy = Y - 380 * h / 100; c.fillStyle = '#8ea6ff'; c.beginPath(); c.arc(X, yy, 14, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.font = '900 64px Rubik'; c.textAlign = 'right'; c.direction = 'rtl'; c.fillText(h + ' מ׳', X - 30, yy + 22);
    c.restore(); }};
});
st.ready();
