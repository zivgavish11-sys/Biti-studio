<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">

const st = await studio({look: 'hero', episode: 27, fog: .001, outro: 'card', outroAt: 28,

const PG = new THREE.Group(); PG.position.set(-40, 0, 0); scene.add(PG);
const yard = await M('pool/backyard', PG); PG.updateMatrixWorld(true);
const pbot = await M('pool/poolBot'); const PB0 = S(yard, 'robotSpot');
// ---- lawn set (z +40)
const LZ = 40, lawn = new THREE.Mesh(new THREE.PlaneGeometry(12, 9), new THREE.MeshStandardMaterial({color: 0x4f7a3a, roughness: 1})); lawn.rotation.x = -Math.PI / 2; lawn.position.set(0, .001, LZ); scene.add(lawn);
const stripes = []; for (let i = 0; i < 6; i++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(.55, 8), new THREE.MeshStandardMaterial({color: 0x6a9a4c, roughness: 1})); s.rotation.x = -Math.PI / 2; s.position.set(-3 + i * 1.1, .003, LZ); s.scale.y = .001; scene.add(s); stripes.push(s); }

const mower = await M('robots/lawnMower');

scene.updateMatrixWorld(true);
const pick = sockPick(vac2, sock), emp = dockEmpty(scene, dock, vac), rig = orbRig(st, orb);
const line = borderLine(scene, [-1.2, 0, .0], [2.2, 0, .0], {to: [-1.2, 0, -1.3]});
const tele = new THREE.Line(new THREE.BufferGeometry().setFromPoints([S(hum, 'head') || V(1.45, 1.6, -.15), S(op, 'head') || V(3, 1.6, -2.1)]), new THREE.LineDashedMaterial({color: 0x8ea6ff, dashSize: .08, gapSize: .06})); tele.computeLineDistances(); scene.add(tele);
const PL = await proLook(st, {mode: 'outdoor', robots: [vac, vac2, dock, hum, wbot, pbot, mower], people: [op], focus: V(0, .5, 0), sun: [.45, .8, .55], haze: 0xe8e0d4, exposure: .1, vig: .45, env: .1, fill: .08, sunI: 2.2});
lawn.material = new THREE.MeshStandardMaterial({color: 0x4f7a3a, roughness: 1}); stripes.forEach(q => q.material = new THREE.MeshStandardMaterial({color: 0x6f9f4e, roughness: 1}));   // proLook re-materials everything to plaster → grass back to green
const EQ = endQuestion(st, {at: A[28], q: 'איזו מטלה לתת לרובוט?', options: ['כביסה', 'מדיח', 'בישול']});
const MF = midFollow(st, {at: A[23], dur: B[24] + .3 - A[23], timer: true});
// camera shots
const W0 = S(wbot, 'fan') || wbot.position, P0 = PB0;
const EYE0 = [[2.9, 1.55, 2.3], [1.4, .55, .2]], EYE1 = [[2.6, 1.5, 1.9], [1.2, .45, .1]];
const WIDE = [[-1.0, 4.4, 5.0], [.4, .5, -1.0]], WIDE2 = [[-.6, 4.0, 5.4], [.2, .5, -1.2]];

const WIN = [[W0.x + 1.7, W0.y + .5, W0.z + 1.6], [W0.x, W0.y - .05, W0.z]], WIN2 = [[W0.x - 2.5, W0.y + 1.2, W0.z + 6], [W0.x, W0.y - 1.9, W0.z]];
const POOL = [[P0.x + 1.6, 1.4, P0.z + 4.2], [P0.x, -.8, P0.z - .6]], POOL2 = [[P0.x - 1.2, 1.2, P0.z + 4.0], [P0.x, -.7, P0.z - .6]];
const LAWN = [[-4.5, 3.2, LZ + 6.5], [.5, 0, LZ - .5]], LAWN2 = [[-1.5, 2.6, LZ + 3.5], [2.6, .2, LZ - 2.6]];
const NOT = [[-.3, 2.6, 3.4], [.3, .8, -.6]], NOT2 = [[.4, 2.4, 3.2], [1.2, .9, -.6]];
const DW = [[-1.3, 1.6, .8], [-2.9, .7, -.8]], TELE = [[.4, 2.2, 2.6], [2.2, 1.1, -1.2]];
const SOCK = [[1.3, .62, 1.4], [.5, .2, .45]], SOCK2 = [[1.1, .5, 1.25], [.5, .22, .45]], LINE = [[.5, 3.2, 3.0], [.5, 0, -.6]];
const k = (t, s) => [t, V(...s[0]), V(...s[1])];
// mower path: drives stripes then back to the dock
const mowP = t => { const u = sm(A[12] - .5, B[12], t), d = sm(A[13], B[13], t); const x = -3 + 5.5 * u, z = LZ + 3.5 - 7 * ((u * 5) % 1 > .5 ? 1 - ((u * 5) % 1 - .5) * 2 : (u * 5) % 1 * 2);
  return d > 0 ? [x + (3.4 - x) * d, z + (LZ - 2.9 - z) * d, Math.PI * d] : [x, z, 0]; };
const orbAt = t => { const twist = sm(A[20], A[20] + .6, t) * (1 - sm(A[25] + .5, A[25] + 1, t)), end = sm(A[28] - .3, A[28] + .2, t);
  return V(1.2, .95, -.1).lerp(V(-.3, .5, -.2), twist).lerp(V(2.25, 1.2, 1.25), end); };
st.frame(t => {
  MF.update(t); EQ.update(t);
  spinVac(vac, t, {mop: 1}); spinVac(vac2, t, {mop: 1}); emp.update(t, win(t, A[7] - .2, B[8] + .3, .3));
  // vac2 glides under the shirt in the hook, then parks for the sock
  if (t < A[20]) { const u = sm(0, A[3], t); vac2.position.set(1.9 - 1.3 * u, 0, .9 - .6 * u); vac2.rotation.y = -.6 - .4 * (1 - u); } else { vac2.position.set(.6, 0, .3); vac2.rotation.y = -.6; }
  const pk = t < A[21] ? 0 : t < A[25] ? sm(A[21], B[22], t) : 1;
  pick.update(pk, {slip: sm(A[26] - .3, B[26], t)});
  line.set(sm(A[27], B[27], t)); line.mesh.visible = t > A[14] && t < A[28] + .3;
  spinBot(wbot, t, {fan: 1, pads: 1});
  pbot.position.copy(PB0); const cl = sm(A[11] - .2, B[11], t); pbot.position.z = PB0.z - (PB0.z - (-.85 + 0)) * Math.min(1, cl * 2); pbot.position.y = PB0.y + 1.2 * sm(.45, 1, cl); pbot.rotation.x = -Math.PI / 2 * sm(.35, .55, cl);
  const [mx, mz, mr] = mowP(t); mower.position.set(mx, 0, mz); mower.rotation.y = mr; const bl = mower.getObjectByName('blade'); bl && (bl.rotation.y = t * 30);
  stripes.forEach((s, i) => { s.scale.y = Math.max(.001, Math.min(1, sm(A[12] - .5, B[12], t) * 6 - i)); });
  tele.visible = t > A[18] && t < B[19] + .4; hum.visible = t > A[18] - .4 && t < A[20] + .2; op.visible = hum.visible;
  // Biti: hook (0.3–2.6 s, curious, points at the shirt) · twist (surprise → happy for the follow card) · end card (happy / wink)
  const on = win(t, -1, 2.6, .3) + win(t, A[20] - .1, B[24] + .3, .3) + sm(A[28] - .2, A[28] + .3, t);
  orb.visible = on > .02; orb.scale.setScalar((.6 + .4 * sm(A[28] - .3, A[28] + .2, t)) * Math.max(.001, Math.min(1, on)));
  const op2 = orbAt(t); orb.position.x = op2.x; orb.position.z = op2.z;
  const mood = t < 3 ? 'curious' : t < B[22] ? 'surprise' : t < A[28] ? 'happy' : t < B[30] ? 'ask' : 'happy';
  rig.update(t, {mood, point: t < 2.6 || (t > A[21] && t < B[22]) ? 1 : 0, look: [-.4, -.4], talk: t > A[28] && t < B[30] ? .5 + .4 * Math.sin(t * 17) : 0});
  orb.position.y += op2.y - .95;
  orb.lookAt(st.cam.position.x, orb.position.y, st.cam.position.z);
  const [cp, ct] = camPath(t, [
    k(0, EYE0), k(B[2], EYE1), k(A[3] + .6, WIDE), k(B[4], WIDE2),
    k(A[5] + .4, DOCK), k(B[8], DOCK2), k(A[9] + .3, WIN), k(B[10], WIN2),
    k(A[11] + .3, POOL), k(B[11], POOL2), k(A[12] + .3, LAWN), k(A[13] + .2, LAWN), k(B[13], LAWN2),
    k(A[14] + .4, NOT), k(B[15], NOT2), k(A[16] + .2, DW), k(B[17], DW), k(A[18] + .3, TELE), k(B[19], TELE),
    k(A[20] + .5, SOCK), k(B[24], SOCK2), k(B[26], SOCK), k(A[27] + .3, LINE), k(B[27], LINE),
    k(A[28] + .3, EYE1), k(END, EYE0)]);
  PL.update(t, ct);
  const eye = t < A[3] + .2 || t > A[28] + .2;
  return {cp, ct, noFlash: true, fov: eye ? 64 : 55, overlay: t2 => {
    const c = st.ctx, P = v => st.proj(v);
    const tag = (p, txt, ok, al, dy = -150) => { if (al < .02) return; const [x0, y0, z] = P(p); if (z > 1) return; const x = Math.min(880, Math.max(200, x0)), y = Math.max(430, Math.min(1180, y0 + dy));
      c.save(); c.globalAlpha = al; c.font = '700 48px Rubik'; c.direction = 'rtl'; const w = c.measureText(txt).width + 120, h = 78;
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y + h / 2); c.lineTo(x0, y0); c.stroke();
      st.rr(x - w / 2, y - h / 2, w, h, 22); c.fillStyle = '#fff'; c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 20; c.fill(); c.shadowBlur = 0;
      const cx = x + w / 2 - 44; c.fillStyle = ok ? '#8ea6ff' : '#f0502a'; c.beginPath(); c.arc(cx, y, 26, 0, 7); c.fill();
      c.strokeStyle = ok ? '#0a0c1c' : '#fff'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath();
      if (ok) { c.moveTo(cx - 12, y); c.lineTo(cx - 3, y + 10); c.lineTo(cx + 13, y - 10); } else { c.moveTo(cx - 9, y - 9); c.lineTo(cx + 9, y + 9); c.moveTo(cx + 9, y - 9); c.lineTo(cx - 9, y + 9); } c.stroke();
      c.fillStyle = '#0a0c1c'; c.textAlign = 'right'; c.fillText(txt, x + w / 2 - 84, y + 17); c.restore(); };
    tag(V(-.15, .45, -2.45), 'שואב ושוטף', true, win(t2, A[5] + .2, B[8] + .2, .3), -260);
    tag(W0, 'קומה 10', true, win(t2, A[9] + .4, B[10] + .2, .3), -260);
    tag(pbot.position, 'מטפס על הקיר', true, win(t2, A[11] + .3, B[11] + .2, .3), -260);
    tag(mower.position.clone().add(V(0, .3, 0)), 'חוזר לטעינה', true, win(t2, A[13], B[13] + .2, .3), -260);
    tag(shirt.position, 'לקפל כביסה', false, win(t2, A[15] - .1, B[17] + .3, .3), -200);
    tag(V(-2.8, .9, -1.0), 'מדיח', false, win(t2, A[16] - .1, B[17] + .3, .3), -260);
    tag(V(-3.15, 1.0, -.45), 'בישול', false, win(t2, A[17] - .1, B[17] + .3, .3), -380);
    tag(S(op, 'head') || V(3, 1.6, -2.1), 'עוזר מרחוק', false, win(t2, A[19] - .2, B[19] + .3, .3), -200);
    if (t2 > A[27] - .2 && t2 < B[27] + .3) { const al = win(t2, A[27] - .2, B[27] + .3, .3); const [lx, ly] = P(line.mesh.position);
      c.save(); c.globalAlpha = al; c.font = '700 46px Rubik'; c.textAlign = 'center'; c.direction = 'rtl';
      for (const [txt, dy, col] of [['✓ יודע', 120, '#8ea6ff'], ['✗ עוד לא', -120, '#f0502a']]) { const w = c.measureText(txt).width + 50; st.rr(lx - w / 2, ly + dy - 38, w, 70, 20); c.fillStyle = '#fff'; c.fill(); c.fillStyle = col; c.fillText(txt, lx, ly + dy + 14); }
      c.restore(); }
  }};
});
st.ready();
