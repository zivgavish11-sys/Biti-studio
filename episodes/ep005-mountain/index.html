    const k = (t - S[8]) / (END - S[8]); cp = V(4.6 + .6 * (1 - k), P.y + 2.3, P.z - 3.6 - .5 * (1 - k)); ct = V(-.3, P.y - .35, P.z - .3);
  }
  return {cp, ct, overlay: t2 => {
    if (t2 > A[5] && t2 < S[3]) st.counter(540, 760, Math.round(sm(A[5] + .3, S[3] - .4, t2) * 3000).toLocaleString('en'), ' מדרגות', '#ffa53a', win(t2, A[5], S[3], .25), 110);
    if (t2 > A[9] - .2 && t2 < S[5]) { const k = sm(A[9] - .2, A[9] + 1.0, t2); st.counter(540, 760, fmt(k * (43 * 60 + 41)), '', '#7cffb0', win(t2, A[9] - .2, S[5], .25), 140); }
    if (t2 > A[6] + .6 && t2 < A[7] + .2) { const tz = -52 - .6 * A[6] + sm(A[6] + .55, A[6] + 1.9, t2) * 4.6; const p = st.proj(V(.8, lineY(tz) + 1.8, tz)); st.tag(p[0], p[1], 'אופס!', '#ffa53a', win(t2, A[6] + .6, A[7] + .2, .2)); }
    if (t2 > A[16] + .1 && t2 < A[16] + 1.4) { const p = st.proj(dog.legs[0].foot.clone().add(V(0, .9, 0))); st.tag(p[0], p[1], 'תוקן ✓', '#ff5fd2', win(t2, A[16] + .1, A[16] + 1.4, .15)); }
  }};
});
st.ready();
