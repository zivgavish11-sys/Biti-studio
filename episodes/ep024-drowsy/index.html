<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// EP024-drowsy — LONG, pro-v3 test #2 (night), frame0 eye-level test #1. Media's cabin kit (fx-cabin.js). Visual script approved by Ziv 2026-11-25.
// Phrases: 0-1 hook | 2 question | 3-4 sensor | 5-7 micro-corrections | 8-9 learns | 10 re-hook | 11-12 hands stop | 13 long moment | 14-15 jerk
//          16-17 no camera, feels the wheel | 18 compare | 19 repeats | 20-21 alert | 22-23 card
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, sm, win, camPath, V} from '/engine/lib/core.js';
import {highway, driverRig, columnXray, wirePulse, cabinLight, steerGraph, clusterAlert} from '/engine/props/fx-cabin.js';
const st = await studio({look: 'hero', episode: 24, fog: .001, outro: 'card',
  hook: ['האוטו יודע', 'שאתם <span class="pill">נרדמים</span>?'], hookEnd: 2.4,
  keys: ['חיישן', 'הזווית', 'ערניים', 'המטורף', 'לזוז', 'משיכה', 'משווה', 'התראה'],
  scenes: (A, B, E) => [0, E]});
const {scene, A, B, END} = st;
const M = async n => { const o = (await st.model(n)).object; scene.add(o); return o; };
const W3 = o => o.getWorldPosition(new THREE.Vector3());
const road = await M('road/nightHighway'), car = await M('car/cabinCar'), drv = await M('people/mannequin-driver');
car.updateMatrixWorld(true); drv.position.copy(W3(car.getObjectByName('driverSpot')));
const hw = highway(scene, road, {car}), rig = driverRig(drv, car), xr = columnXray(car), wp = wirePulse(car), cab = cabinLight(scene, car);
const gs = {k: 0, mode: 'awake', spike: 0, ring: 0};
const graph = st.screen([.5, .28], (c, t, W, H) => steerGraph(c, t, W, H, gs), {light: .7});
graph.mesh.position.set(.75, 1.25, .2); graph.mesh.rotation.set(-.2, Math.PI + .5, 0); scene.add(graph.mesh);
const cs = {k: 0}; const clu = st.screen(car.getObjectByName('cluster'), (c, t, W, H) => clusterAlert(c, t, W, H, cs), {light: .8});
const PL = await proLook(st, {mode: 'night', robots: [], people: [drv], focus: V(0, 1, 0), exposure: 1.1});
const sp = W3(car.getObjectByName('sensorSpot')), WC = W3(car.getObjectByName('columnAxis')), HEAD = W3(drv.getObjectByName('head'));
const GP = graph.mesh.position.clone();
// camera spots
const EYE0 = [[-.45, 1.15, -.72], [.6, 1.12, -.05]], EYE1 = [[-.43, 1.16, -.66], [.6, 1.1, .0]];
const HIGH = [[-5.5, 4.2, -8], [0, .8, 1]], HIGH2 = [[-6.5, 4.8, -10], [0, .6, 2]], DRIFT = [[-4.2, 3.4, -6.5], [.4, .5, 3]];
const COL = [[-.12, .98, -.12], [sp.x, sp.y, sp.z]], COLC = [[-.08, .95, -.05], [sp.x, sp.y, sp.z]];
const TOP = [[WC.x - .15, WC.y + .5, WC.z - .35], [(WC.x + GP.x) / 2, WC.y, (WC.z + GP.z) / 2]];
const TOPC = [[WC.x - .1, WC.y + .42, WC.z - .28], [(WC.x + GP.x) / 2, WC.y + .05, (WC.z + GP.z) / 2]];
const GR = [[GP.x - .55, GP.y + .05, GP.z - .55], [GP.x, GP.y, GP.z]];
const HD = [[HEAD.x - .8, HEAD.y + .05, HEAD.z + .25], [HEAD.x, HEAD.y - .08, HEAD.z]], HDC = [[HEAD.x - .7, HEAD.y + .03, HEAD.z + .2], [HEAD.x, HEAD.y - .1, HEAD.z]];
const GRW = [[GP.x - .8, GP.y - .02, GP.z - .8], [GP.x - .12, GP.y - .12, GP.z]];
const WIRE = [[-.2, .78, .0], [.25, .7, .4]], WIREC = [[-.18, .75, .05], [.2, .62, .45]];
const CLU = [[.37, 1.36, .0], [.37, .78, .45]], CLUC = [[.37, 1.33, .04], [.37, .78, .45]];
const k = (t, s) => [t, s[0], s[1]];
st.frame(t => {
  // drift toward the lane line while the hands stop, snap back on the jerk
  const drift = sm(A[11], B[13], t) * (1 - sm(A[15], A[15] + .5, t)) + .15 * sm(A[19], B[19], t) * (1 - sm(B[19], A[20] + .3, t));
  hw.update(t, {speed: 25, laneX: .9 * drift});
  const calm = 1 - .9 * win(t, A[11], A[15], .3);        // micro-corrections almost stop
  const jerk = Math.exp(-(((t - (A[15] + .15)) / .18) ** 2));
  const wig = calm * (.05 * Math.sin(t * 2.3) + .025 * Math.sin(t * 5.1)) - .35 * jerk;
  const drowsy = win(t, .2, 2.6, .5) * .5 + win(t, A[10], A[15] + .1, .4) * .85;
  rig.update({steer: wig, drowsy});
  xr.set(Math.max(win(t, A[3] - .3, B[4] + .4, .5), win(t, A[16] - .1, B[17] + .2, .5))); wp.set(sm(A[16] + .2, B[17] - .2, t) * (t < A[18] + .2 ? 1 : 0));
  cab.set(1 - .7 * win(t, A[10], B[17], .5));
  // graph
  if (t < A[8]) { gs.mode = 'awake'; gs.k = sm(A[5] - .2, B[7], t); }
  else if (t < A[11]) { gs.mode = 'band'; gs.k = sm(A[8], B[9], t); }
  else if (t < A[18]) { gs.mode = 'drowsy'; gs.k = sm(A[11], B[13] + .4, t); gs.spike = sm(A[15], A[15] + .25, t); }
  else { gs.mode = 'compare'; gs.k = 1; gs.spike = 1; gs.ring = sm(A[18] + .4, B[18], t); }
  graph.update(t); cs.k = sm(A[20], A[20] + .7, t); clu.update(t);
  const [cp, ct] = camPath(t, [
    k(0, EYE0), k(A[2] - .2, EYE1), k(A[2] + .5, HIGH), k(B[2] + .3, HIGH2),
    k(A[3] + .5, COL), k(B[4], COLC),
    k(A[5] + .4, GRW), k(B[7], GRW), k(A[8] + .4, GR), k(B[9], GR),
    k(A[10] + .4, HD), k(B[10] + .3, HDC), k(A[11] + .6, DRIFT), k(B[13], DRIFT),
    k(B[15] + .2, DRIFT),
    k(A[16] + .4, COL), k(B[17], COLC), k(A[18] + .3, GR), k(B[18], GR),
    k(A[19] + .4, HIGH), k(A[20] + .3, CLU), k(B[21], CLUC),
    k(A[22] - .2, EYE1), k(END, EYE0)]);
  PL.update(t, ct);
  const eye = t < A[2] + .1 || t > A[22] - .3;
  return {cp, ct, noFlash: true, fov: eye ? 78 : 55, overlay: t2 => {
    const L = (a, b, lab, p, dx, dy) => { if (t2 > a && t2 < b) { const [x, y] = st.proj(p); st.callout(x + dx, y + dy, lab, x, y, win(t2, a, b, .25)); } };
    L(A[3] + .4, B[4] + .3, 'חיישן זווית', sp, 0, -300);
    L(A[16] + .6, B[17], 'מחשב', W3(car.getObjectByName('ecu')), 0, -280);
  }};
});
st.ready();
</script></body></html>
