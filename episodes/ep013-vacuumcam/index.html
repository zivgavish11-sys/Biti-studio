// front camera (added): dark lens + light-blue ring on the bumper, in vacuum local space (front = +z after test)

sock.position.set(.15, .045, 1.0); sock.rotation.y = .4; sock.castShadow = true; scene.add(sock);
const cable = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(-1.1, 0, .6), V(-.7, 0, .95), V(-.35, 0, .75), V(-.1, 0, 1.15), V(-.3, 0, 1.5)]), 60, .015, 8), M(0x0e0f22, {roughness: .5}));
cable.position.y = .016; cable.castShadow = true; scene.add(cable);

// floating screen over the vacuum (photo → "?" → consent → laser-only), joined by a dashed line
const SC = {mode: 0, k: 0, q: 0, sign: 0, doubt: 0};
const scr1 = st.screen([.95, .72], (c, t, W, H) => { c.fillStyle = '#10123a'; c.fillRect(0, 0, W, H); c.strokeStyle = 'rgba(142,166,255,.5)'; c.lineWidth = 6; c.strokeRect(3, 3, W - 6, H - 6);

const scr2 = st.screen([1.5, .95], (c, t, W, H) => { c.fillStyle = '#0d0f2e'; c.fillRect(0, 0, W, H); c.strokeStyle = 'rgba(142,166,255,.5)'; c.lineWidth = 6; c.strokeRect(3, 3, W - 6, H - 6);

  const px = W * .06, py = H * .16, pw = W * .62, ph = H * .78; c.save(); rr(c, px, py, pw, ph, 14); c.clip(); c.fillStyle = '#23265a'; c.fillRect(px, py, pw, ph);

  c.globalAlpha = 1;
}, {px: 1000, light: .5});

// ---------- set 3 (x = -3.4): a phone: a closed group where the photos ended up ----------

  c.fillStyle = '#12142e'; font(c, 700, W * .085); c.fillText('🔒 קבוצה סגורה', W / 2, H * .08); c.fillStyle = '#c9cdf5'; c.fillRect(0, H * .11, W, 3);
  for (let i = 0; i < 3; i++) { const a = Math.min(1, Math.max(0, GR.n - i)); if (a <= 0) continue; c.globalAlpha = a; const y = H * (.14 + i * .29);
    c.fillStyle = '#c9cdf5'; c.beginPath(); c.arc(W * .88, y + H * .03, W * .05, 0, 7); c.fill(); c.fillRect(W * .45, y + H * .018, W * .33, H * .022);

const flyM = st.screen([.32, .24], (c, t, W, H) => { c.fillStyle = '#10123a'; c.fillRect(0, 0, W, H); photo(c, W * .04, H * .05, W * .92, H * .9, 1); }, {px: 320, light: .5}).mesh.material;

  f.visible = u > 0 && u < 1; if (f.visible) { const e = u * u * (3 - 2 * u); f.position.copy(bez(a, b, h, e)); f.lookAt(cp); f.scale.setScalar(.6 + .5 * Math.sin(Math.PI * e)); } } };

st.frame(t => {

  vac.position.x = .25 * Math.sin(t * .35); vac.position.z = .1 * Math.cos(t * .35); vac.rotation.y = -.5 + .15 * Math.sin(t * .3);
  if (brush) brush.rotation.y = t * 9; if (lidar) lidar.rotation.y = t * 6;
  // x-ray: shell turns see-through from phrase 3, solid again at 17
  const xr = win(t, A[3] - .2, A[17] - .1, .4); shellM.forEach(m => m.opacity = 1 - .78 * xr);
  const camOn = win(t, A[3], A[22], .3); lensRingM.color.set(ACC).lerp(new THREE.Color(0xffffff), .3 * (.5 + .5 * Math.sin(t * 6)) * camOn);
  coneM.opacity = .22 * win(t, A[3] + .2, A[6], .3) + .15 * win(t, .1, A[1] - .2, .3);
  // end: camera removed, laser only
  cam0.scale.setScalar(Math.max(.001, 1 - sm(A[22] + .6, A[22] + 1.0, t))); rayM.opacity = .9 * sm(A[22], A[22] + .3, t); rays.rotation.y = t * 4;
  // screen 1 modes
  SC.mode = t < A[2] ? 0 : t < A[17] ? 1 : t < A[20] ? 2 : 3; SC.q = sm(A[5], A[5] + .3, t); SC.sign = sm(A[17] + .2, A[17] + 1.2, t); SC.doubt = sm(A[19], A[19] + .4, t); SC.k = sm(A[23] - .1, A[23] + .2, t);
  const s1 = win(t, .15, A[6], .3) + win(t, A[17] - .3, END + 1, .3); scr1.mesh.visible = s1 > .01; scr1.mesh.scale.setScalar(Math.max(.01, s1)); dash1.material.opacity = s1;
  scr1.update(t);
  // set 2: photos arrive (8), labels (10-12), worker looks at the phone (leak)
  LB.k = sm(A[8], A[9], t); LB.n = sm(A[10] - .1, A[10] + .2, t) + sm(A[11] - .1, A[11] + .2, t) + sm(A[12] - .1, A[12] + .2, t); scr2.update(t);
  if (wkHead) wkHead.rotation.y = .5 * sm(A[14], A[14] + .4, t) * (1 - sm(A[17] - .3, A[17], t)) + .08 * Math.sin(t * 1.3);
  // set 3: group posts appear in the hook and again on the leak

  const sh = (tt, tg, off, z) => [tt, [tg[0] + off[0] * z, tg[1] + off[1] * z, tg[2] + off[2] * z], tg];
  const T1 = [-.3, .55, -.45], O1 = [-.6, 1.25, 3.4];        // vacuum + toilet + screen (frame 0 = last frame)
  const T1c = [.05, .2, .45], O1c = [-.5, .9, 1.9];         // vacuum close (camera, cone, sock)
  const TP = [X3, 1.25, 0], OP = [-.7, .4, 2.6];             // phone

  const TM = [(X2 + X3) / 2 + .2, 1.15, -.1], OM = [-.4, 1.1, 4.4]; // wide: company → phone
  const m = (a, b) => (a + b) / 2;
  const [cp, ct] = camPath(t, [
    sh(0, T1, O1, 1.0), sh(A[1] - .2, T1, O1, .85),                                                     // photo taken (hook)
    sh(A[1] + .5, TP, OP, 1.05), sh(A[2] - .1, TP, OP, .9),                                              // closed group on a phone
    sh(A[3] - .1, T1, O1, 1.0), sh(A[3] + .9, T1c, O1c, 1.1), sh(A[4] + .3, T1c, O1c, .9), sh(A[5] + .2, T1c, O1c, 1.05), sh(A[6] - .1, T1, O1, .9),   // x-ray: camera, cone, sock & cable, "?"
    sh(A[8] - .1, T1, O1, 1.25), sh(A[9] - .2, T2, O2, 1.15), sh(A[10], T2, O2, .9), sh(A[12] + .3, [X2 + .2, 1.35, -.3], O2, .75),                   // photos fly to the company, labels
    sh(A[13] + .2, T2, O2, 1.0), sh(A[15], TM, OM, 1.0), sh(A[16] + .5, TM, OM, .92), sh(A[17] - .1, TP, OP, 1.05),                                 // twist: the labelers leaked it → phone
    sh(A[17] + .5, T1, O1, .95), sh(A[19] + .3, [.5, .9, -.45], O1, .7), sh(A[20], T1, O1, .95),                                                      // consent form over the vacuum
    sh(A[22] + .2, T1c, O1c, 1.25), sh(A[23] + .3, T1c, O1c, 1.05), sh(A[24] - .1, T1, O1, 1.0), sh(END, T1, O1, 1.0)]);                              // laser only, back to frame 0
  scr1.mesh.lookAt(cp); scr2.mesh.lookAt(cp.x, scr2.mesh.position.y, cp.z);
  const VC = camWorld(); const PHP = V(X3, 1.3, .1), CO = V(X2, 1.2, -.3);
