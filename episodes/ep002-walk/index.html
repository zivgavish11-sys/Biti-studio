<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// EP002 — איך רובוט לומד ללכת לבד (massively parallel RL in simulation)
import {studio, THREE, COL, rng, sm, win, camKF, V} from '/engine/lib/core.js';
const st = await studio({
  episode: 2,
  hook: ['הרובוט הזה נפל', '<span class="pill">אלפי</span> פעמים'],
  bloom: 0.75,
  // S: 0 hook-crowd | 1 intro | 2 virtual world | 3 points | 4 RE-HOOK copies | 5 timer | 6 real robot | 7 payoff | 8 follow
  scenes: (A, B, END) => [0, A[2] - .25, A[4] - .25, A[7] - .25, A[12] - .25, A[16] - .25, A[18] - .25, A[20] - .25, A[22] - .25, END],
  chips: (A, B, S) => [
    {a: A[5], b: S[3], y: 330, c: '', h: '🎮 עולם וירטואלי<small>סימולציה של רובוט</small>'},
    {a: A[7], b: A[9] - .1, y: 330, c: 'grn', h: '✅ צעד קדימה = 1+'},
    {a: A[9], b: A[11] - .1, y: 330, c: 'red', h: '❌ נפילה = 1−'},
    {a: A[11], b: S[4], y: 330, c: 'org', h: '🧊 כמו תינוק על קרח'},
    {a: A[14], b: S[5], y: 330, c: 'pnk', h: '⚡ אלפי עותקים במקביל<small>על מחשב אחד</small>'},
    {a: A[16], b: S[6], y: 330, c: '', h: '⏱️ פחות מ־4 דקות<small>הולך על משטח ישר</small>'},
    {a: A[18], b: S[7], y: 330, c: 'org', h: '🧠 מהסימולציה לרובוט אמיתי'},
    {a: A[20], b: S[8], y: 330, c: 'grn', h: '💡 הנפילות לימדו'},
  ],
});
const {scene, A, B, S, END} = st; const r = rng(11);
const BOT = 'robot/RobotExpressive', SC = 0.55;

// ================= L1: TRAINING FIELD (crowd of copies) at z=-90 =================
const F = new THREE.Group(); F.position.set(0, 0, -90); scene.add(F);
const fgrid = new THREE.GridHelper(120, 60, 0x2ee6ff, 0x1a2a66); fgrid.material.transparent = true; fgrid.material.opacity = .5; F.add(fgrid);
const crowd = []; const N = 6, GAP = 4.6;
const ringGeo = new THREE.TorusGeometry(1.0, .06, 8, 40);
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const m = await st.model(BOT, {scale: SC}); const x = (i - (N - 1) / 2) * GAP, z = (j - (N - 1) / 2) * GAP;
  m.object.position.set(x, 0, z); m.object.rotation.y = Math.PI; F.add(m.object);
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: COL.cyan})); ring.rotation.x = Math.PI / 2; ring.position.set(x, .03, z); F.add(ring);
  const off = r() * 1.6; const mix = ['Walking', 'Death', 'WalkJump', 'Death', 'Running', 'Jump'][Math.floor(r() * 6)];
  // S0: everyone falls (staggered) | S4: chaotic training | S5+: all walk
  m.schedule(r() < .8 ? 'Death' : 'WalkJump', -off, 0).schedule(mix, S[4] - off * .3).schedule('Walking', S[5] + r() * .3);
  crowd.push({m, ring, x, z, ph: r() * 6});
}
// far "infinite" copies: simple glowing capsules to suggest thousands
const farMat = new THREE.MeshBasicMaterial({color: 0x3a6bff, transparent: true, opacity: .55});
const farGeo = new THREE.CapsuleGeometry(.45, 1.2, 4, 8);
const far = new THREE.InstancedMesh(farGeo, farMat, 900); let fi = 0; const dm = new THREE.Matrix4();
for (let i = -15; i < 15; i++) for (let j = -15; j < 15; j++) { if (Math.abs(i) < 4 && Math.abs(j) < 4) continue; if (j * GAP < -14) continue; if (fi >= 900) break; dm.makeTranslation(i * GAP, 1, j * GAP); far.setMatrixAt(fi++, dm); }
far.count = fi; F.add(far);

// ================= L2: VIRTUAL LAB (hero) at origin =================
const L2 = new THREE.Group(); scene.add(L2);
const lgrid = new THREE.GridHelper(60, 30, 0x2ee6ff, 0x1a2250); lgrid.material.transparent = true; L2.add(lgrid);
const pad = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({color: 0x0b1440, emissive: 0x1b2a8a, emissiveIntensity: .5})); pad.rotation.x = -Math.PI / 2; pad.position.y = .01; L2.add(pad);
const padRing = new THREE.Mesh(new THREE.TorusGeometry(3, .07, 8, 64), new THREE.MeshBasicMaterial({color: COL.cyan})); padRing.rotation.x = Math.PI / 2; padRing.position.y = .03; L2.add(padRing);
const cubes = [];
for (let k = 0; k < 26; k++) { const s = .6 + r() * 1.4; const c = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(s, s, s)), new THREE.LineBasicMaterial({color: k % 3 ? COL.cyan : COL.purple, transparent: true}));
  const a = r() * Math.PI * 2, d = 8 + r() * 12; c.position.set(Math.cos(a) * d, 1 + r() * 7, Math.sin(a) * d - 4); L2.add(c); cubes.push({c, sp: (r() - .5) * 1.5, y0: c.position.y}); }
const hero = await st.model(BOT, {scale: SC}); L2.add(hero.object);
hero.schedule('Wave', 0, 0).schedule('Idle', S[2]).schedule('Walking', A[7]).schedule('Death', A[9] - .15).schedule('WalkJump', A[11]).schedule('Death', A[11] + .9).schedule('Idle', S[4]);

// ================= L3: REAL WORLD (city) at x=120 =================
const L3 = new THREE.Group(); L3.position.set(120, 0, 0); scene.add(L3);
const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 120), new THREE.MeshStandardMaterial({color: 0x0d1030})); road.rotation.x = -Math.PI / 2; road.position.set(0, .01, -40); L3.add(road);
for (const sx of [-5, 5]) { const ln = new THREE.Mesh(new THREE.PlaneGeometry(.15, 120), new THREE.MeshBasicMaterial({color: COL.orange})); ln.rotation.x = -Math.PI / 2; ln.position.set(sx, .02, -40); L3.add(ln); }
const names = ['building-small-a', 'building-small-b', 'building-small-c', 'building-small-d', 'building-garage'];
for (let i = 0; i < 14; i++) { const b = await st.model('city/' + names[i % 5], {scale: 3 + r() * 1.5}); st.neon(b.object, COL.purple, 0x9a8cff, .06);
  b.object.position.set((i % 2 ? 1 : -1) * 11, 0, 10 - Math.floor(i / 2) * 9); b.object.rotation.y = (i % 2 ? -1 : 1) * Math.PI / 2; L3.add(b.object); }
const real = await st.model(BOT, {scale: SC}); L3.add(real.object); real.object.rotation.y = Math.PI;
real.schedule('Sitting', 0, 0).schedule('Standing', A[19] - .5).schedule('Walking', A[19] + .6);
// ghosts of past falls behind the walking robot (payoff)
const ghosts = [];
for (let k = 0; k < 6; k++) { const g = await st.model(BOT, {scale: SC}); g.schedule('Death', -10 - k, 0);
  g.object.traverse(m => { if (m.isMesh) { m.material = new THREE.MeshBasicMaterial({color: k % 2 ? COL.cyan : COL.pink, transparent: true, opacity: 0, depthWrite: false}); } });
  g.object.position.set((k % 2 ? 3.2 : -3.2), 0, -5 - k * 3.2); g.object.rotation.y = Math.PI + (r() - .5); L3.add(g.object); ghosts.push(g); }
const orb = new THREE.Mesh(new THREE.SphereGeometry(.45, 24, 16), new THREE.MeshBasicMaterial({color: COL.pink})); L3.add(orb);
const orbHalo = new THREE.Mesh(new THREE.SphereGeometry(.8, 24, 16), new THREE.MeshBasicMaterial({color: COL.pink, transparent: true, opacity: .25})); orb.add(orbHalo);

const bgN = new THREE.Color(0x05061a), bgP = new THREE.Color(0x1a0630), fogN = new THREE.Color(0x070a24), fogP = new THREE.Color(0x2a0a40);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ================= PER FRAME =================
st.frame(t => {
  // re-hook color shift (pink) during S4
  const pk = win(t, S[4], S[5], .3); scene.background.copy(bgN).lerp(bgP, pk * .8); st.fog.color.copy(fogN).lerp(fogP, pk);
  for (const c of crowd) c.ring.material.color.setHex(t >= S[4] && t < S[5] ? COL.pink : (t >= S[5] ? 0x7cffb0 : COL.cyan));
  fgrid.material.opacity = .5;
  // crowd walks forward from S5
  const walkZ = -Math.max(0, t - S[5]) * 1.3; for (const c of crowd) { c.m.object.position.z = c.z + walkZ; c.ring.position.z = c.z + walkZ; }
  const fz = -90 + walkZ; // crowd center (world z)
  // lab
  for (const q of cubes) { q.c.rotation.x = t * q.sp; q.c.rotation.y = t * q.sp * .7; q.c.position.y = q.y0 + Math.sin(t + q.sp * 5) * .3; q.c.material.opacity = sm(S[2] - .1, S[2] + .6, t) * .8 + .1; }
  lgrid.material.opacity = .25 + .4 * sm(S[2], S[2] + .8, t);
  let hz = 0; if (t > A[7]) hz = -Math.min(t - A[7], A[9] - .15 - A[7]) * 1.1; if (t > A[11]) hz += -Math.min(t - A[11], .9) * .9;
  hero.object.position.set(0, 0, hz); hero.object.rotation.y = t < A[7] ? 0.25 * Math.sin(t) : Math.PI;
  // real world
  const rz = -Math.max(0, t - (A[19] + .6)) * 1.25; real.object.position.set(0, 0, rz);
  const ok = sm(S[6], A[19] - .3, t); orb.position.set(0, 12 - 10.2 * ok, -1 + 1 * ok); orb.visible = t > S[6] && t < A[19] + .2; orb.scale.setScalar(1 + .15 * Math.sin(t * 10));
  ghosts.forEach((g, k) => g.object.traverse(m => { if (m.isMesh) m.material.opacity = .32 * sm(S[7] + k * .25, S[7] + k * .25 + .5, t); }));

  let cp, ct;
  if (t < S[1]) { // HOOK: crane over falling crowd (mid-action from frame 0)
    const a = -.35 + t * .08; cp = V(Math.sin(a) * 22, 10 - t * .8, fz + Math.cos(a) * 22); ct = V(0, 1, fz);
  } else if (t < S[2]) { // intro: hero waves, slow orbit
    const a = (t - S[1]) * .18 - .2; cp = V(Math.sin(a) * 10.5, 3.4, Math.cos(a) * 10.5); ct = V(0, 1.9, 0);
  } else if (t < S[3]) { // virtual world: crane up and back to reveal cubes
    [cp, ct] = camKF(t, [[S[2], [4, 3.2, 10], [0, 1.9, 0]], [S[3], [-7, 8, 15], [0, 1.8, -1]]]);
  } else if (t < S[4]) { // points: follow hero from the side
    const k = (t - S[3]) / (S[4] - S[3]); cp = V(10.5 - k * 3, 3.6 + k * 1.5, hz + 8 - k * 2); ct = V(t > A[9] ? -1.2 : 0, 1.7, hz - 1);
  } else if (t < S[5]) { // RE-HOOK: low inside the copies -> huge crane up
    const k = sm(S[4], S[5], t); cp = V(-4 + 10 * k, 3.5 + 26 * k, fz + 26 - 4 * k); ct = V(0, 1, fz - 2 - 6 * k);
  } else if (t < S[6]) { // timer: crowd walks, camera tracks in front
    const k = (t - S[5]) / (S[6] - S[5]); cp = V(6 - 8 * k, 6, fz - 24); ct = V(0, 1.2, fz);
  } else if (t < S[7]) { // real robot: brain arrives, stands, walks
    const k = (t - S[6]) / (S[7] - S[6]); cp = V(120 + 7 - 2 * k, 4 - .5 * k, 9.5 - 1 * k + rz); ct = V(120, 1.6 + 1.5 * (1 - ok), rz - .5);
  } else if (t < S[8]) { // payoff: high trailing shot over ghosts
    const k = (t - S[7]) / (S[8] - S[7]); cp = V(120 - 4 + 2 * k, 7.5 + k, rz + 12); ct = V(120, 1, rz - 3);
  } else { // END: echo of frame 0 composition (crowd now walking)
    const k = (t - S[8]) / (END - S[8]); const a = -.35 - .1 * (1 - k); cp = V(Math.sin(a) * 22, 10 + .5 * (1 - k), fz + Math.cos(a) * 22); ct = V(0, 1, fz);
  }
  return {cp, ct, overlay: t2 => {
    // points: +1 / -1 floating over the hero
    if (t2 > A[7] && t2 < A[9]) { const p = st.proj(V(0, 3.4 + (t2 - A[7]) * .4, hz)); st.counter(p[0], p[1], '1+', '', '#7cffb0', win(t2, A[7], A[9] - .1), 120); }
    if (t2 > A[9] && t2 < A[11]) { const p = st.proj(V(0, 3.0 + (t2 - A[9]) * .4, hz)); st.counter(p[0], p[1], '1−', '', '#ff4d6d', win(t2, A[9], A[11] - .1), 120); }
    if (t2 > S[5] && t2 < S[6]) { const k = sm(S[5], S[6] - .2, t2); st.counter(540, 700, fmt(k * 235), '', '#2ee6ff', win(t2, S[5], S[6], .25), 150); }
    if (t2 > A[13] && t2 < S[5]) { st.counter(540, 720, Math.round(sm(A[13], S[5] - .3, t2) * 4000).toLocaleString('en'), ' עותקים', '#ff5fd2', win(t2, A[13], S[5], .25), 110); }
  }};
});
st.ready();
</script></body></html>
