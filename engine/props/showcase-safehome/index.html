<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-15 run 9 — ep017-safehome kit: robots/humanoidSafe (joint motors, chest brain, wires, soft knit cover), people/mannequin-child(Kneel),
// home2056/livingRoom + home/laundryPile, foldedStack, laundryBasket, mug; FX engine/props/fx-arm.js (xray, motor, signal, brain, cover, stopRing, effortGraph, forceGauge).
// Render: python3 tools/render.py frames engine/props/showcase-safehome 1,4.5,7.4,10.5
import {studio, THREE, camKF} from '/engine/lib/core.js';
import {xray, motor, signal, brain, cover, stopRing, effortGraph} from '/engine/props/fx-arm.js';
const st = await studio({look: 'hero', hook: ['רובוט בבית', '<span class="pill">מרגיש</span> מגע'], hookEnd: 2.4, fog: .012, scenes: (A, B, E) => [0, E]});
const {scene} = st;
st.stage({r: 60, grid: 0, spot: [1.5, 6, 3], target: [0, .6, 0]});
const P = async (n, o = {}) => (await st.prop(n, {tint: 1, ...o})).object;
await P('home2056/livingRoom', {x: 0, z: -.6});
await P('home2056/sofaModern', {x: -1.2, z: -1.9});
await P('home2056/loungeSet', {x: -.4, z: .1});
await P('home2056/planterTall', {x: -3.0, z: -2.5});
await P('home/laundryBasket', {x: -1.6, z: .5});
await P('home/laundryPile', {x: -.65, y: .41, z: .05, fit: [.55, .45]});
await P('home/foldedStack', {x: -.05, y: .41, z: .1});
const cup = await P('home/mug', {x: .2, y: .41, z: .35});
const warm = new THREE.PointLight(0xffd9a8, 3, 6, 1.6); warm.position.set(2.5, 1.5, -2.5); scene.add(warm);
// robot by the coffee table, folding; right arm reaches toward the cup
const bot = await P('robots/humanoidSafe', {x: .85, z: .45, ry: -Math.PI / 2 + .25});
const J = n => bot.getObjectByName(n);
const xr = xray(bot), cv = cover(bot), br = brain(bot), sg = signal(bot, 'ElbowR'), sgS = signal(bot, 'ShoulderR'), sgW = signal(bot, 'WristR');
const mS = motor(bot, 'ShoulderR'), mE = motor(bot, 'ElbowR'), mW = motor(bot, 'WristR'), ring = stopRing(bot, 'elbowR');
const kid = await P('people/mannequin-childKneel', {x: 1.2, z: 1.6});
const K = n => kid.getObjectByName(n), V3 = () => new THREE.Vector3();
const poseBot = rk => { J('torso').rotation.x = .2 + .3 * rk; J('shoulderR').rotation.set(-.35 - .35 * rk, 0, -.12); J('elbowR').rotation.x = -.35 - .25 * rk; J('wristR').rotation.x = -.3;
  J('shoulderL').rotation.set(-.15, 0, .12); J('elbowL').rotation.x = -.5; J('kneeL').rotation.x = J('kneeR').rotation.x = .12; J('hipL').rotation.x = J('hipR').rotation.x = -.12; J('head').rotation.x = .35; };
// contact pose (rk at t 7.0) → place the child so its fingertip lands on the robot's forearm ('touchR')
const RK = t => Math.min(1, t / 7.4);
poseBot(RK(7.0)); bot.updateMatrixWorld(true); const T = J('touchR').getWorldPosition(V3());
const hand = J('wristR').getWorldPosition(V3()); cup.position.x += Math.min(.15, Math.max(-.9, hand.x - .12)) - .2; cup.position.z += Math.min(.38, Math.max(-.2, hand.z)) - .35;
kid.lookAt(T.x, kid.position.y, T.z); let best = [9, -1.5];
for (let a = -.8; a > -2.8; a -= .02) { K('shoulderR').rotation.set(a, 0, -.1); kid.updateMatrixWorld(true); const F = K('fingertipR').getWorldPosition(V3()); const e = Math.abs(F.y - T.y); if (e < best[0]) best = [e, a]; }
const KA = best[1]; K('shoulderR').rotation.set(KA, 0, -.1); kid.updateMatrixWorld(true); const F = K('fingertipR').getWorldPosition(V3());
kid.position.x += T.x - F.x; kid.position.z += T.z - F.z;
// floating effort screen joined by a dashed line
let G = {k: 0, spike: 0, stop: 0};
const scr = st.screen([.62, .36], effortGraph(() => G)); scr.mesh.position.set(1.9, 1.9, .2); scene.add(scr.mesh);
const dash = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({color: 0x8ea6ff, dashSize: .05, gapSize: .04})); scene.add(dash);
const sm = (a, b, t) => { const k = Math.min(1, Math.max(0, (t - a) / (b - a))); return k * k * (3 - 2 * k); };
st.frame(t => {
  poseBot(RK(t));
  xr.set(sm(2.4, 3.2, t) * (1 - sm(8.6, 9.2, t)));
  const frozen = t > 7.4, spin = Math.min(t, 7.4) * 6; mS.set(sm(3, 3.6, t) * (1 - sm(4.4, 5, t)) * .6, spin); mE.set(sm(3.6, 4.2, t) * .5 + sm(6.4, 6.8, t) * .5 - sm(7.6, 8.4, t) * .9, spin); mW.set(sm(4.2, 4.8, t) * (1 - sm(5.2, 5.6, t)) * .6, spin * 1.3);
  br.set(sm(5, 5.5, t) * (1 - sm(5.8, 6, t)) + sm(6.8, 7.0, t) * (1 - sm(7.6, 8, t)));
  sgS.set(sm(3, 3.6, t)); sgW.set(sm(4.2, 4.8, t));
  if (t < 6.8) sg.set(sm(3.6, 4.2, t)); else sg.set(sm(6.8, 7.3, t), 'back');
  ring.set(sm(7.3, 7.7, t) * (1 - sm(8.6, 9, t)));
  cv.set(sm(9.2, 10.2, t));
  // child's hand comes into the arm's path
  J('shoulderR').updateMatrixWorld(); K('shoulderR').rotation.set(KA + .9 * (1 - sm(5.6, 7.0, t)), 0, -.1);
  G = {k: sm(4.8, 7.4, t) * .7 + .3 * sm(5, 5.1, t) * 0, spike: sm(6.6, 7.2, t), stop: sm(7.4, 8.0, t)}; scr.update(t);
  const eW = J('elbowR').getWorldPosition(V3()); scr.mesh.position.set(eW.x - .35, eW.y + .62, eW.z + .15); scr.mesh.visible = t > 4.6 && t < 9; scr.mesh.lookAt(st.cam.position);
  const e = new THREE.Vector3(); J('elbowR').getWorldPosition(e); dash.geometry.setFromPoints([e, scr.mesh.position.clone().add(new THREE.Vector3(0, -.18, 0))]); dash.computeLineDistances(); dash.visible = scr.mesh.visible;
  const c0 = [T.x + 2.4, T.y + 1.5, T.z + 2.6], f0 = [T.x - .3, T.y - .1, T.z - .3];
  const [cp, ct] = camKF(t, [[0, c0, f0], [2.6, [T.x + 1.7, T.y + .8, T.z + 1.7], [T.x - .1, T.y, T.z - .2]], [4.5, [T.x + 1.5, T.y + 1.0, T.z + 1.1], [T.x - .3, T.y + .2, T.z - .3]], [6.5, [T.x + 1.7, T.y + 1.0, T.z + 1.5], [T.x - .2, T.y + .25, T.z - .2]], [8.5, [T.x + .9, T.y + .5, T.z + 1.0], [T.x - .1, T.y + .05, T.z - .1]], [10.5, [T.x + 1.8, T.y + 1.1, T.z + 2.0], [T.x - .3, T.y, T.z - .3]], [12, c0, f0]]);
  return {cp, ct, noFlash: true}; });
st.ready();
</script></body></html>
