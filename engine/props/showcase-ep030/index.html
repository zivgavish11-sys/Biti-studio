<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-27 — ep030 kit check: t 1 frame0 (rear window, baby asleep, ceiling waves) · 2 high wide lot (parent walks away) · 3 rear door open
// t 4 ceiling radar close · 5 blanket see-through + breath graph · 6 bag on the seat
// Render: python3 tools/render.py frames engine/props/showcase-ep030 1,2,3,4,5,6
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, V} from '/engine/lib/core.js';
import {waveFan, echoDots, breathe, seeThrough, drawBreath, paintCar} from '/engine/props/fx-radar.js';
const st = await studio({look: 'hero', fog: .001, hook: [], hookEnd: 0, scenes: (A, B, E) => [0, E]});
const {scene} = st;
const M = async (n) => { const o = (await st.model(n)).object; scene.add(o); return o; };
const S = (o, n) => o.getObjectByName(n).getWorldPosition(new THREE.Vector3());
const lot = await M('outdoor/parkingLot'); lot.updateMatrixWorld(true);
const car = await M('car/familyCar'); car.position.copy(S(lot, 'carSpot')); car.updateMatrixWorld(true);
for (const [i, c] of [[2, 'blue'], [4, 'black'], [8, 'red'], [9, 'white']]) { const o = await M('car/sedanLite'); paintCar(o, c); o.position.copy(S(lot, 'bayB' + i)); }
for (const [i, c] of [[3, 'silver'], [5, 'white'], [6, 'sand'], [10, 'blue']]) { const o = await M('car/sedanLite'); paintCar(o, c); o.position.copy(S(lot, 'bayA' + i)); o.rotation.y = Math.PI; }
const seat = await M('everyday/infantSeat'); seat.position.copy(S(car, 'rearSeatSpot')); seat.rotation.y = Math.PI; seat.updateMatrixWorld(true);
const bs = seat.getObjectByName('babySpot'), BQ = bs.getWorldQuaternion(new THREE.Quaternion());
const baby = await M('people/mannequin-baby'); baby.position.copy(S(seat, 'babySpot')); baby.quaternion.copy(BQ);
const bl = await M('everyday/blanket'); bl.position.copy(S(seat, 'babySpot')).add(V(0, .02, 0)); bl.quaternion.copy(BQ);
const bag = await M('everyday/babyBag'); bag.position.copy(S(car, 'rearSeatSpot')).add(V(0, -.02, 0)); bag.visible = false;
const mom = await M('people/mannequin-walk'); mom.position.set(-1.5, 0, 1);
// t 6: the seat set alone on the ground (x 20) to check baby + blanket
const seat2 = await M('everyday/infantSeat'); seat2.position.set(20, 0, 0); seat2.rotation.y = -2.3; seat2.getObjectByName('canopy').rotation.x = .9; seat2.updateMatrixWorld(true);
const b2s = seat2.getObjectByName('babySpot'), B2Q = b2s.getWorldQuaternion(new THREE.Quaternion());
const baby2 = await M('people/mannequin-baby'); baby2.position.copy(S(seat2, 'babySpot')); baby2.quaternion.copy(B2Q);
const bl2 = await M('everyday/blanket'); bl2.position.copy(S(seat2, 'babySpot')).add(V(0, .01, 0)); bl2.quaternion.copy(B2Q);
scene.updateMatrixWorld(true);
const fan = waveFan(scene, S(car, 'ceilingRadarSpot'), {mode: 'cone', dir: V(0, -1, 0), vAngle: .7, range: 1.1, speed: .8});
const dot = echoDots(scene, {r: .015});
const SCR = st.screen([.9, .45], (c, t, W, H) => drawBreath(c, t, W, H, {mode: 'baby', k: 1, ruler: 1})); const scr = SCR.mesh; scene.add(scr); scr.position.copy(S(car, 'rearSeatSpot')).add(V(-1.4, .75, 0)); scr.rotation.y = -Math.PI / 2;
const PL = await proLook(st, {mode: 'outdoor', preset: 'warm', robots: [], people: [mom, baby], focus: V(0, 1, 5), exposure: .62, env: .28, fill: .2, sunI: 2.6, sun: [.5, .6, .5]});
st.frame(t => {
  const sh = Math.max(1, Math.min(6, Math.floor(t + .001)));
  car.getObjectByName('rearDoorR').rotation.y = sh === 3 || sh === 5 || sh === 6 ? 1.15 : 0; seat.getObjectByName('canopy').visible = sh !== 6;
  fan.update(t, sh === 1 || sh === 4 || sh === 5 ? 1 : 0);
  const ph = breathe(baby, t); dot.set(sh === 1 ? [S(baby, 'chestSpot').add(V(0, .05 + .01 * ph, 0))] : [], {size: .02});
  seeThrough(bl, sh === 5 ? 1 : 0); SCR.update(t); bl.visible = true; baby.visible = true; bag.visible = false; scr.visible = sh === 5;
  mom.position.set(-1.5, 0, sh === 2 ? -6 : 3.5);
  const v = [null, [[-2.0, 1.3, 4.7], [-.4, .75, 4.55]], [[-8, 14, 20], [0, 0, 0]], [[-3.4, 1.6, 3.2], [-.4, .7, 4.6]], [[-1.1, 1.0, 4.4], [0, 1.4, 4.5]], [[-3.0, 1.3, 4.8], [-.7, .8, 4.55]], [[20.9, .95, .9], [20, .3, 0]]][sh];
  PL.update(t, V(...v[1])); return {cp: V(...v[0]), ct: V(...v[1]), noFlash: true, fov: 50};
});
st.ready();
</script></body></html>
