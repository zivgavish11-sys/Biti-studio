<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-27 run 20 — ep030 CUTAWAY check (video request): t 1 frame0 eye level by the open rear door · 2 high 3/4 (cutRoof + cutSideR + cutFront hidden)
// t 3 chest close-up (cut) · 4 eye level, side cut only (roof kept, radar strip) · Render: python3 tools/render.py frames engine/props/showcase-ep030cut 1,2,3,4
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, V} from '/engine/lib/core.js';
import {waveFan, breathe, paintCar, rearFill} from '/engine/props/fx-radar.js';
const st = await studio({look: 'hero', fog: .001, hook: [], hookEnd: 0, scenes: (A, B, E) => [0, E]});
const {scene} = st;
const M = async (n) => { const o = (await st.model(n)).object; scene.add(o); return o; };
const S = (o, n) => o.getObjectByName(n).getWorldPosition(new THREE.Vector3());
const lot = await M('outdoor/parkingLot'); lot.updateMatrixWorld(true);
const car = await M('car/familyCar'); car.position.copy(S(lot, 'carSpot')); car.updateMatrixWorld(true);
for (const [i, c] of [[2, 'blue'], [4, 'black'], [8, 'red']]) { const o = await M('car/sedanLite'); paintCar(o, c); o.position.copy(S(lot, 'bayB' + i)); }
const seat = await M('everyday/infantSeat'); seat.position.copy(S(car, 'rearSeatSpot')); seat.rotation.y = Math.PI; seat.updateMatrixWorld(true);
const BQ = seat.getObjectByName('babySpot').getWorldQuaternion(new THREE.Quaternion());
const baby = await M('people/mannequin-baby'); baby.position.copy(S(seat, 'babySpot')); baby.quaternion.copy(BQ);
const bl = await M('everyday/blanket'); bl.position.copy(S(seat, 'babySpot')).add(V(0, .01, 0)); bl.quaternion.copy(BQ);
seat.getObjectByName('canopy').visible = false;
scene.updateMatrixWorld(true);
const CS = S(car, 'rearSeatSpot'), cx = CS.x, cy = CS.y, cz = CS.z;
const fan = waveFan(scene, S(car, 'ceilingRadarSpot'), {mode: 'cone', dir: V(0, -1, 0), vAngle: .7, range: 1.1, speed: .8});
const PL = await proLook(st, {mode: 'outdoor', preset: 'warm', robots: [], people: [baby], focus: CS, exposure: .5, env: .22, fill: .16, sunI: 2.6, sun: [.5, .6, .5], vig: .3});
const fill = rearFill(scene, car);
const cut = (k, roof, side) => { car.getObjectByName('cutRoof').visible = !roof; car.getObjectByName('cutSideR').visible = !side; car.getObjectByName('cutFront').visible = !side; };
st.frame(t => {
  const sh = Math.max(1, Math.min(4, Math.floor(t + .001)));
  car.getObjectByName('rearDoorR').rotation.y = 1.15;
  cut(0, sh === 2 || sh === 3, sh !== 1); fill.set(1); breathe(baby, t);
  fan.update(t, sh === 2 ? 1 : 0);
  const v = [null, [[cx - 1.25, 1.6, cz + .25], [cx, cy + .2, cz - .05]], [[cx - 1.25, 2.55, cz + .55], [cx + .05, cy + .12, cz - .05]], [[cx - .8, 1.3, cz + .02], [cx, cy + .2, cz + .1]], [[cx - 1.55, 1.4, cz + .3], [cx, cy + .3, cz - .05]]][sh];
  PL.update(t, V(...v[1])); return {cp: V(...v[0]), ct: V(...v[1]), noFlash: true, fov: sh === 3 ? 40 : 50};
});
st.ready();
</script></body></html>
