<script type="module">
// Media pro 2026-11-25 — ep028 end card v2 (Ziv: no white box, Biti more prominent, tied to the video): the soft home humanoid at the front door with the lease card,
// the mini robot beside it, Biti big in front asking; question = open white text + dark pills. Render: python3 tools/render.py frames engine/props/showcase-ep028end 3.6
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, V} from '/engine/lib/core.js';
import {leaseCard, gripGlass} from '/engine/props/fx-ep028.js';
import {orbRig} from '/engine/props/fx-biti.js';
import {endQuestion} from '/engine/lib/follow-mid.js';
const st = await studio({look: 'hero', outro: 'card', fog: .001, hook: [], hookEnd: 0, scenes: (A, B, E) => [0, E]});
const {scene} = st;
const M = async n => { const o = (await st.model(n)).object; scene.add(o); return o; };
const door = await M('buildings/frontDoor');
const soft = await M('pro/humanoidSoft'); soft.position.set(.25, 0, 1.0); soft.rotation.y = -.15;
const mini = await M('pro/humanoidMini'); mini.position.set(-.62, 0, 1.35); mini.rotation.y = .35;
{ const J = n => mini.getObjectByName(n); J('shoulderR').rotation.set(-2.6, 0, .2); J('elbowR').rotation.x = -.3; }   // waves
const orb = await M('robots/bitiOrb'); orb.position.set(-.08, 1.3, 2.55); orb.rotation.y = 0;
scene.updateMatrixWorld(true);
const rig = orbRig(st, orb);
const lc = st.screen([.5, .66], (c, t, W, H) => leaseCard(c, t, W, H, {k: 1}), {light: .45}); lc.mesh.position.set(.6, 1.05, 2.0); lc.mesh.rotation.y = -.2; lc.mesh.scale.setScalar(.62); scene.add(lc.mesh); lc.mesh.visible = false;   // lease card belongs to the re-hook, not the end card (it got cropped by the shrinking card)
const EQ = endQuestion(st, {at: 2.0, q: 'הייתם לוקחים רובוט במנוי?', options: ['כן', 'לא']});
const PL = await proLook(st, {mode: 'studio', preset: 'warm', robots: [], people: [], focus: V(0, 1.2, 2)});
st.frame(t => {
  lc.update(t); rig.update(t, {mood: t < 3.3 ? 'ask' : 'happy', look: [0, .1], talk: t > 2 && t < 3.3 ? .5 + .4 * Math.sin(t * 17) : 0});
  EQ.update(t);
  const cp = [0, 1.35, 4.3], ct = [0, 1.12, 1.2]; PL.update(t, V(0, 1.2, 2.5));
  return {cp: V(...cp), ct: V(...ct), noFlash: true, fov: 50};
});
st.ready();
</script></body></html>
