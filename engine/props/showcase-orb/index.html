<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-25 — Biti = bitiOrb (Ziv's pick) with personality, in the ep026 kitchen: t 1 hook (curious, points at the bag) · t 2 twist (surprise) · t 3 think · t 5.6 follow moment (happy + card).
// Render: python3 tools/render.py frames engine/props/showcase-orb 1,2,3,5.6
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, V} from '/engine/lib/core.js';
import {orbRig} from '/engine/props/fx-biti.js';
import {midFollow} from '/engine/lib/follow-mid.js';
const st = await studio({look: 'hero', fog: .001, hook: [], hookEnd: 0, keys: ['תעקבו'], scenes: (A, B, E) => [0, E]});
const {scene} = st;
const M = async n => { const o = (await st.model(n)).object; scene.add(o); return o; };
const S = (o, n) => o.getObjectByName(n).getWorldPosition(new THREE.Vector3());
const room = await M('buildings/kitchenLiving'); room.updateMatrixWorld(true);
const bot = await M('pro/humanoid'); bot.position.copy(S(room, 'robotSpot')); bot.rotation.y = -.25;
const J = n => bot.getObjectByName(n); J('shoulderR').rotation.set(-1.0, 0, .2); J('elbowR').rotation.x = -.9; J('head').rotation.set(.25, -.2, 0);
const bag = await M('everyday/crumpledBag'); scene.remove(bag); J('wristR').add(bag); bag.position.set(0, -.11, .03);
const orb = await M('robots/bitiOrb'); orb.position.set(.05, 1.55, -1.45); orb.rotation.y = -.5;
scene.updateMatrixWorld(true);
const rig = orbRig(st, orb);
const MF = midFollow(st, {at: 4.6, dur: 1.6, slot: 'biti'}), MF2 = midFollow(st, {at: 7.0, dur: 1.6, slot: 'biti', timer: true});
const PL = await proLook(st, {mode: 'outdoor', robots: [bot], people: [], focus: V(.5, 1.3, -1.8), sun: [.45, .8, .55], haze: 0xe8e0d4, exposure: .36, env: .16, fill: .1, sunI: 2.2});
st.frame(t => {
  const m = t < 1.5 ? {mood: 'curious', point: 1, look: [.6, -.2]} : t < 2.5 ? {mood: 'surprise'} : t < 3.5 ? {mood: 'think', look: [.5, .6]} : {mood: 'happy'};
  rig.update(t, m); MF.update(t); MF2.update(t);
  const cp = [-.55, 1.45, .25], ct = [.35, 1.3, -1.8];
  PL.update(t, V(...ct));
  return {cp: V(...cp), ct: V(...ct), noFlash: true, fov: 50};
});
st.ready();
</script></body></html>
