<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// ep031 product look proposal (Ziv picked "lamp": white light sphere on a wooden base, no screen). Preview only.
// t=1 idle on the counter · t=4 called by name (light breathes, light-blue ring = listening)
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, sm, camPath, V} from '/engine/lib/core.js';
const st = await studio({look: 'hero', fog: .001, scenes: (A, B, E) => [0, E]});
const {scene} = st;
const real = (o) => { o.material.userData.real = true; return o; };
const mat = (c, r, extra = {}) => { const m = new THREE.MeshStandardMaterial({color: c, roughness: r, ...extra}); m.userData.real = true; return m; };
// kitchen counter + back wall
const top = real(new THREE.Mesh(new THREE.BoxGeometry(3.2, .04, .7), mat(0xeeeae4, .35))); top.position.set(0, .9, 0); scene.add(top);
const fronts = real(new THREE.Mesh(new THREE.BoxGeometry(3.2, .88, .66), mat(0x8a6a4a, .6))); fronts.position.set(0, .44, .01); scene.add(fronts);
const wall = real(new THREE.Mesh(new THREE.BoxGeometry(4, 2.2, .05), mat(0xf3f1ec, .9))); wall.position.set(0, 1.1, -.38); scene.add(wall);
const floor = real(new THREE.Mesh(new THREE.BoxGeometry(6, .02, 6), mat(0xc9bfb1, .8))); floor.position.y = -.01; scene.add(floor);
for (const o of [top, fronts, wall, floor]) { o.castShadow = o.receiveShadow = true; }
// props: mug, plant pot, cutting board
const mug = real(new THREE.Mesh(new THREE.CylinderGeometry(.045, .04, .1, 32), mat(0x3b4a5a, .5))); mug.position.set(-.55, .97, .05); scene.add(mug);
const pot = real(new THREE.Mesh(new THREE.CylinderGeometry(.07, .055, .13, 32), mat(0xd9d2c6, .7))); pot.position.set(.75, .985, -.15); scene.add(pot);
const leaves = real(new THREE.Mesh(new THREE.IcosahedronGeometry(.11, 1), mat(0x4f6b45, .8))); leaves.position.set(.75, 1.12, -.15); scene.add(leaves);
const board = real(new THREE.Mesh(new THREE.BoxGeometry(.38, .02, .25), mat(0xb08a5e, .7))); board.position.set(-.95, .93, -.05); board.rotation.y = .2; scene.add(board);
// THE DEVICE v3 (Ziv 2026-11-27 picked "disc tower"): stack of white discs; the rims between them light up light-blue one after another with the voice
const dev = new THREE.Group(); dev.position.set(.1, .92, .02); scene.add(dev);
const bodyM = mat(0xf6f4f0, .42);
const N = 8, R = .045, H = .018, GAP = .005, rims = [];
for (let i = 0; i < N; i++) {
  const r = R * (1.5 - .17 * i);
  const d = real(new THREE.Mesh(new THREE.CylinderGeometry(r, r, H, 64), bodyM)); d.position.y = i * (H + GAP) + H / 2; d.castShadow = true; dev.add(d);
  if (i < N - 1) {
    const m = new THREE.MeshBasicMaterial({color: 0xd8dde8}); m.userData.real = true;
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(r * .985, r * .985, GAP, 64, 1, true), m); rim.position.y = i * (H + GAP) + H + GAP / 2; dev.add(rim); rims.push(m);
  }
}
const cap = real(new THREE.Mesh(new THREE.SphereGeometry(R * (1.5 - .17 * (N - 1)), 64, 16, 0, Math.PI * 2, 0, Math.PI / 2), bodyM)); cap.scale.y = .18; cap.position.y = N * (H + GAP) - GAP; dev.add(cap);
const glow = new THREE.PointLight(0x8ea6ff, 0, .5); glow.position.set(0, .1, .08); dev.add(glow);
const OFF = new THREE.Color(0xd8dde8), ON = new THREE.Color(0x7f9bff);
const PL = await proLook(st, {mode: 'studio', preset: 'warm', robots: [], people: [], focus: V(.1, 1.0, .02), exposure: .5, vig: .28});
st.frame(t => {
  const call = sm(2.6, 3.2, t);                    // called by name → rims light up bottom to top like a voice level
  rims.forEach((m, i) => { const lvl = .5 + .5 * Math.sin(t * 6 - i * .9); m.color.copy(OFF).lerp(ON, call * (.45 + .55 * lvl)); });
  glow.intensity = call * .5;
  const [cp, ct] = camPath(t, [[0, [.2, 1.3, 1.9], [.05, .98, 0]], [2.4, [.55, 1.2, 1.0], [.1, 1.0, 0]], [6, [.25, 1.08, .45], [.1, 1.0, 0]]]);
  PL.update(t, ct);
  return {cp, ct, noFlash: true};
});
st.ready();
</script></body></html>
