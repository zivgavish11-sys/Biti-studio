<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Library showcase (Media pro, 2026-11-04): drone kit for ep006. Not an episode.
// t 0–4: drone over a park in front of apartment blocks · 4–8: drone close-up · 8–12: x-ray (shell see-through, IMU chip) · 12–16: waiter with tray
import {studio, THREE, COL, V, camKF} from '/engine/lib/core.js';
const st = await studio({hook: [], scenes: (A, B, E) => [0, 4, 8, 12, 16, E]});
const {scene} = st;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({color: 0x17263a, roughness: .95}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const path = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 40), new THREE.MeshStandardMaterial({color: 0x2a3142, roughness: .9}));
path.rotation.x = -Math.PI / 2; path.position.set(2.5, .01, 0); path.receiveShadow = true; scene.add(path);
// park (Quaternius CC0)
const P = (n, o) => st.prop('outdoor/' + n, o);
await P('CommonTree_1', {h: 5, x: -4, z: -5}); await P('CommonTree_2', {h: 4.5, x: 5.5, z: -6}); await P('CommonTree_3', {h: 4, x: -6.5, z: 1});
await P('PalmTree_1', {h: 6.5, x: 7.5, z: -2}); await P('PalmTree_3', {h: 6, x: -2, z: -9});
await P('Bush_1', {h: .9, x: -2.6, z: -2.4}); await P('Bush_2', {h: .8, x: 4.2, z: -1.5}); await P('Flowers', {h: .4, x: -1.4, z: -1.8});
await P('Bench_1', {h: .85, x: 4.2, z: 1.2, ry: -Math.PI / 2}); await P('Streetlight_Single', {h: 4, x: 3.8, z: -3.5});
await P('Rock_1', {h: .5, x: -3, z: 1.5});
for (let i = 0; i < 6; i++) await P('Grass', {h: .3, x: -5 + i * 1.7, z: -3.2 + (i % 2) * 1.8});
// apartment blocks behind
await P('4Story', {h: 13, x: -9, z: -18}); await P('3Story_Balcony', {h: 10, x: 1, z: -17}); await P('2Story_Balcony', {h: 7, x: 10, z: -16});
await st.prop('people/character-female-b', {h: 1.6, x: 3.2, z: .4, ry: -2.2, anim: 'idle'});
await st.prop('people/character-male-d', {h: 1.1, x: 4.25, z: 1.2, ry: -Math.PI / 2, anim: 'sit', y: .1});
const dr = await st.prop('drone/quadcopter', {x: 0.5, y: 2.2, z: 2.5, scale: 3});   // ×3 for the wide shot readability; true scale for close-ups below
// x-ray copy far away at true scale ×4
const XX = 40; const dx = await st.prop('drone/quadcopter', {x: XX, y: 1, z: 0, scale: 4});
dx.object.traverse(q => { if (q.isMesh && (q.name === 'shell' || q.name === 'shellTop')) { q.material = q.material.clone(); q.material.transparent = true; q.material.opacity = .18; q.material.depthWrite = false; } });
const xpad = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, .04, 64), new THREE.MeshStandardMaterial({color: 0x1d2440, roughness: .8})); xpad.position.set(XX, .02, 0); xpad.receiveShadow = true; scene.add(xpad);
// waiter
const WX = -40;
await st.prop('home/table', {fit: [1.6, .9], x: WX - 1.6, z: -1});
const waiter = await st.prop('people/character-male-a', {h: 1.6, x: WX, z: 0, ry: .4, anim: 'holding-both'});
const tray = await st.prop('home/trayGlasses', {x: WX + .05, y: .72, z: .5, tint: 1, scale: 1.3});
const props = (o) => [0, 1, 2, 3].map(i => o.object.getObjectByName('prop' + i));
const pr = props(dr), prx = props(dx);
st.frame(t => {
  pr.forEach((p, i) => p && (p.rotation.y = t * 40 * (i % 2 ? -1 : 1)));
  prx.forEach((p, i) => p && (p.rotation.y = t * 6 * (i % 2 ? -1 : 1)));
  dr.object.position.y = 2.2 + Math.sin(t * 1.7) * .08; dr.object.rotation.z = Math.sin(t * 2.3) * .06; dr.object.rotation.x = Math.sin(t * 1.9) * .05;
  tray.object.rotation.z = Math.sin(t * 2.1) * .04; tray.object.rotation.x = Math.sin(t * 1.6) * .03;
  let cp, ct;
  if (t < 4) [cp, ct] = camKF(t, [[0, [4.6, 3.0, 9.5], [0.3, 2.6, -1]], [4, [2.4, 3.2, 10], [0.3, 2.6, -1]]]);
  else if (t < 8) [cp, ct] = camKF(t, [[4, [2.6, 4.4, 5.6], [0.5, 2.2, 2.5]], [8, [1.6, 4.6, 5.9], [0.5, 2.2, 2.5]]]);
  else if (t < 12) [cp, ct] = camKF(t, [[8, [XX + 2.2, 2.6, 2.6], [XX, .9, 0]], [12, [XX + 1.2, 2.8, 3.2], [XX, .9, 0]]]);
  else [cp, ct] = camKF(t, [[12, [WX + 2.4, 1.9, 3.4], [WX, 1.2, 0]], [16, [WX + 1.6, 2.0, 3.8], [WX, 1.2, 0]]]);
  return {cp, ct};
});
st.ready();
</script></body></html>
