<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-14 run 6 — 'הבית בעוד 30 שנה' luxury villa kit (home2056/*, vehicles/autoCar, drone/deliveryDrone), assembled as one world.
// Render: python3 tools/render.py frames engine/props/showcase-home 1,5,9,13
import {studio, THREE, camKF} from '/engine/lib/core.js';
const st = await studio({look: 'hero', hook: ['הבית שלכם', 'בעוד <span class="pill">30 שנה</span>'], hookEnd: 3, fog: .010, scenes: (A, B, E) => [0, 4, 8, 12, E]});
const {scene} = st;
st.stage({r: 160, grid: 0, spot: null});
const spot = (p, tg, pw = 30, reach = 14, ang = .6) => { const s = new THREE.SpotLight(0xffffff, pw, reach, ang, .8); s.position.set(...p); s.target.position.set(...tg); s.castShadow = true; s.shadow.mapSize.set(1024, 1024); scene.add(s, s.target); };
const P = async (n, o = {}) => (await st.prop(n, {tint: 1, ...o})).object;
// house (16×10), garden in front (+z), garage behind
const villa = await P('home2056/villa', {x: 0, z: 1.1});   // bbox centre → shell spans x −8..8, z −5..5 (+terrace)
const grass = new THREE.Mesh(new THREE.PlaneGeometry(26, 12), new THREE.MeshStandardMaterial({color: 0x253872, roughness: .95})); grass.rotation.x = -Math.PI / 2; grass.position.set(0, .005, 12.5); grass.receiveShadow = true; scene.add(grass);
// living: sofa faces the media wall on the left
await P('home2056/mediaWall', {x: -7.6, z: 2.6, ry: Math.PI / 2});
await P('home2056/loungeSet', {x: -5.6, z: 2.6});
await P('home2056/sofaModern', {x: -3.8, z: 2.4, ry: -Math.PI / 2});
await P('home2056/arcLamp', {x: -3.0, z: 4.3, ry: Math.PI});
await P('home2056/planterTall', {x: -7.5, z: .5}); await P('home2056/planterTall', {x: -2.5, z: .5});
const vac = await P('home/robotVacuum', {x: -5.6, z: 3.6}); vac.scale.multiplyScalar(1.6);
// dining + art
await P('home2056/diningSet', {x: 0, z: 2.6});
await P('home2056/artFrame', {x: 0, y: .15, z: .12});
// kitchen
await P('home2056/kitchenRun', {x: 7.45, z: 2.4, ry: -Math.PI / 2});
await P('home2056/kitchenIsland', {x: 4.6, z: 2.5, ry: Math.PI / 2});
await P('robots/humanoid', {x: 6.7, z: 2.1, ry: Math.PI / 2});
// bedroom
await P('home2056/bedModern', {x: -5.5, z: -3.0});
await P('home2056/planterTall', {x: -7.4, z: -4.4});
// garden: pool deck, hot tub, loungers, umbrella, outdoor kitchen, fire pit
await P('home2056/pool', {x: 2.5, z: 11.2});
for (let i = 0; i < 3; i++) await P('home2056/lounger', {x: .2 + i * 1.6, y: .35, z: 13.4, ry: Math.PI});
await P('home2056/umbrella', {x: 5.6, y: .35, z: 13.3});
await P('home2056/hotTub', {x: 6.4, y: .35, z: 9.2});
await P('home2056/outdoorKitchen', {x: 10.2, z: 10.5, ry: -Math.PI / 2});
await P('home2056/firePit', {x: -5.2, z: 11.6});
for (const [x, z, n] of [[-9.5, 14.5, 'outdoor/PalmTree_1'], [12, 15, 'outdoor/PalmTree_3'], [-10, 8, 'outdoor/PalmTree_3']]) await P(n, {x, z, h: 4, tint: .9});
const dog = await P('robots/robotDog', {x: -2.2, z: 9.2, ry: .6}); dog.scale.multiplyScalar(1.3);
// behind: garage with roof drone pad + empty parking bay (door faces the back road)
await P('home2056/garage', {x: 4.5, z: -10.6, ry: Math.PI});
const car = await P('vehicles/autoCar', {x: -2.2, z: -11.2});
const dd = await P('drone/deliveryDrone', {x: 4.5, y: 4.2, z: -8.4});
// lights
spot([-5, 7, 7], [-5, 0, 2.5], 45); spot([0, 7, 7], [0, 0, 2.5], 35); spot([5, 7, 7], [5, .6, 2.5], 45); spot([-4, 7, 1], [-4, 0, -3], 30); spot([1, 7, 1], [2.5, 0, -2.5], 30, 14, .8);
spot([2, 10, 18], [2, 0, 11], 80, 22, .8); spot([2, 10, -4], [2, 1.5, -10.5], 60, 18, .75); spot([0, 30, 22], [0, 0, 2], 120, 60, .75);
st.frame(t => {
  const ph = dd.getObjectByName('drone'); if (ph) for (let i = 0; i < 4; i++) { const p = ph.getObjectByName('prop' + i); if (p) p.rotation.y = t * 30 * (i % 2 ? -1 : 1); }
  dd.position.y = 4.2 + .1 * Math.sin(t * 2);
  const lh = car.getObjectByName('lidarHead'); if (lh) lh.rotation.y = t * 5;
  for (let i = 0; i < 5; i++) { const f = scene.getObjectByName('flame' + i); if (f) f.scale.y = .85 + .25 * Math.sin(t * 7 + i * 1.7); }
  let cp, ct;
  if (t < 4) [cp, ct] = camKF(t, [[0, [0, 22, 24], [0, 0, 3]], [4, [0, 20, 21], [0, 0, 3]]]);
  else if (t < 8) [cp, ct] = camKF(t, [[4, [-1, 8, 19], [3, .3, 11]], [8, [0, 7.5, 18], [3, .3, 11]]]);
  else if (t < 12) [cp, ct] = camKF(t, [[8, [2, 9, 9], [1, .5, 0]], [12, [2.5, 8.5, 8.5], [1, .5, 0]]]);
  else [cp, ct] = camKF(t, [[12, [-1, 14, 4], [1.5, 2, -10]], [16, [-.5, 13.5, 3.5], [1.5, 2, -10]]]);
  return {cp, ct, noFlash: true}; });
st.ready();
</script></body></html>
