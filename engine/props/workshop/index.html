<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro visual workshop 2026-11-07 — demo of the approved HERO look (studio({look:'hero'}), st.stage, st.screen, white caption pill)
// + the first Israeli-everyday props (everyday/smartphone, router, cellTower, busStop). Sets: vacuum x0 · router x20 · tower x40 · bus stop x60.
// Render: python3 tools/render.py frames engine/props/workshop 1,5,9,13
import {studio, THREE, V, camKF} from '/engine/lib/core.js';
const st = await studio({look: 'hero', episode: 11, hook: ['מה השואב הרובוטי', 'עושה <span class="pill">בסתר</span>?'], hookEnd: 3.6, fog: .02, scenes: (A, B, E) => [0, 4, 8, 12, E]});
const {scene} = st;
st.stage({r: 120, grid: 0, spot: null}); // one big indigo floor for all sets
// --- set 1: vacuum (x-ray) + phone with the cleaning map
const grid1 = new THREE.GridHelper(4, 16, 0x2c2f6e, 0x23265c); grid1.position.y = .003; scene.add(grid1);
const spot = (p, tg, pw = 18, reach = 6) => { const s = new THREE.SpotLight(0xffffff, pw, reach, .5, .7); s.position.set(...p); s.target.position.set(...tg); s.castShadow = true; scene.add(s, s.target); };
spot([-.6, 2.4, 1.4], [.15, 0, 0]);
const vac = await st.prop('home/robotVacuum', {h: .12, tint: 1});
vac.object.traverse(m => { if (m.isMesh && /shell|bumper/.test(m.name + m.parent?.name)) { const n = m.material.clone(); n.transparent = true; n.opacity = .3; n.color.set(0xb7c0f0); n.depthWrite = false; m.material = n; } });
const ph = await st.prop('everyday/smartphone', {x: .4, y: 0, z: -.32, tint: 1}); ph.object.scale.multiplyScalar(2.4); ph.object.rotation.set(-.12, -.45, 0);
const mapUI = st.screen(ph.object.getObjectByName('screen'), (c, t, W, H) => {
  const k = W / 600; c.scale(k, k); const w = 600;
  c.fillStyle = '#f4f5fb'; c.fillRect(0, 0, w, H / k);
  c.fillStyle = '#12142e'; c.font = '700 54px Rubik'; c.fillText('ניקוי הבית', 560, 120);
  c.fillStyle = '#6b6f93'; c.font = '400 34px Rubik'; c.fillText('הסתיים · 42 דקות', 560, 175);
  c.fillStyle = '#dfe3f6'; c.fillRect(40, 230, 520, 600); c.strokeStyle = '#12142e'; c.lineWidth = 8; c.strokeRect(40, 230, 520, 600);
  c.beginPath(); c.moveTo(300, 230); c.lineTo(300, 500); c.moveTo(40, 560); c.lineTo(400, 560); c.stroke();
  c.fillStyle = '#5b4bff'; c.globalAlpha = .28; [[60, 250, 220, 290], [320, 250, 220, 560], [60, 580, 320, 230]].forEach(([x, y, a, b]) => c.fillRect(x, y, a, b)); c.globalAlpha = 1;
  c.fillStyle = '#12142e'; c.font = '700 36px Rubik'; c.fillText('סלון', 540, 420); c.fillText('מטבח', 270, 360); c.fillText('חדר שינה', 330, 720);
  c.fillStyle = '#e8338f'; c.beginPath(); c.arc(180, 700, 18, 0, 7); c.fill();
  c.fillStyle = '#12142e'; c.font = '700 44px Rubik'; c.fillText('מפה נשמרה ✓', 560, 920);
  c.fillStyle = '#6b6f93'; c.font = '400 32px Rubik'; c.fillText('3 חדרים · 68 מ״ר', 560, 975);
  c.fillStyle = '#12142e'; c.beginPath(); c.roundRect(40, 1060, 520, 110, 55); c.fill(); c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '700 44px Rubik'; c.fillText('נקה שוב', 300, 1130);
}, {px: 1300});
// --- set 2: router + phone with Hebrew Wi-Fi screen
spot([18.8, 2.2, 1.6], [20, 0, 0], 16);
await st.prop('everyday/router', {x: 20, z: 0, tint: 1, scale: 2.2});
const ph2 = await st.prop('everyday/smartphone', {x: 20.5, y: .0, z: .35, tint: 1}); ph2.object.scale.multiplyScalar(2.2); ph2.object.rotation.set(-1.2, -.25, 0); ph2.object.position.y = .03;
st.screen(ph2.object.getObjectByName('screen'), (c, t, W, H) => { const k = W / 600; c.scale(k, k);
  c.fillStyle = '#f4f5fb'; c.fillRect(0, 0, 600, 1400); c.fillStyle = '#12142e'; c.font = '700 54px Rubik'; c.fillText('Wi-Fi', 560, 120);
  [['הבית_של_ביטי', 'מחובר'], ['שואב רובוטי', 'מחובר'], ['מקרר', 'מחובר'], ['טלוויזיה', 'לא פעיל']].forEach(([n, s], i) => { const y = 260 + i * 170;
    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(40, y - 80, 520, 130, 26); c.fill(); c.fillStyle = '#12142e'; c.font = '700 54px Rubik'; c.fillText(n, 530, y);
    c.fillStyle = i < 3 ? '#1f9e6a' : '#9aa0bd'; c.font = '400 40px Rubik'; c.fillText(s, 530, y + 46); });
}, {px: 1300});
// --- set 3: cell tower at night
await st.prop('everyday/cellTower', {x: 40, z: -6});
spot([34, 4, 8], [40, 15, -6], 900, 45); spot([46, 22, 2], [40, 16, -6], 500, 30);
// --- set 4: bus stop with Hebrew arrival board + route plate
spot([56, 5, 6], [60.5, 1.4, 0], 60, 16);
const bus = await st.prop('everyday/busStop', {x: 60, z: 0, tint: 1});
st.screen(bus.object.getObjectByName('screen'), (c, t, W, H) => { c.fillStyle = '#0b1022'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#ffa53a'; c.font = `700 ${H * .27}px Rubik`; c.fillText('קו 5 · מרכז העיר', W - 30, H * .42); c.fillText('קו 18 · הנמל', W - 30, H * .85);
  c.textAlign = 'left'; c.fillText('2 דק׳', 30, H * .42); c.fillText('9 דק׳', 30, H * .85); }, {px: 1200, light: .6});
st.screen(bus.object.getObjectByName('sign'), (c, t, W, H) => { c.fillStyle = '#f2f4f8'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#1d6fd6'; c.fillRect(0, 0, W, H * .32); c.fillStyle = '#fff'; c.font = `700 ${H * .2}px Rubik`; c.textAlign = 'center'; c.fillText('תחנת אוטובוס', W / 2, H * .23);
  c.direction = 'ltr'; c.fillStyle = '#12142e'; c.font = `700 ${H * .38}px Rubik`; c.fillText('5  18  61', W / 2, H * .8); }, {px: 700});
st.frame(t => { const lid = vac.object.getObjectByName('lidar'); if (lid) lid.rotation.y = t * 3; let cp, ct;
  if (t < 4) [cp, ct] = camKF(t, [[0, [-.65, .55, 1.35], [.12, .22, -.1]], [4, [-.5, .58, 1.4], [.12, .22, -.1]]]);
  else if (t < 8) [cp, ct] = camKF(t, [[4, [19.3, .75, 1.35], [20.15, .12, .05]], [8, [19.5, .8, 1.3], [20.15, .12, .05]]]);
  else if (t < 12) [cp, ct] = camKF(t, [[8, [35, 6, 7], [40, 13.5, -6]], [12, [36.2, 6.5, 7.4], [40, 14, -6]]]);
  else [cp, ct] = camKF(t, [[12, [58.6, 1.8, 5.6], [61.1, 1.7, 0]], [16, [59.1, 1.85, 5.8], [61.1, 1.7, 0]]]);
  return {cp, ct}; });
st.ready();
</script></body></html>
