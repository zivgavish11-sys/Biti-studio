<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-16 run 10 — home2056 robot lineup (future vote options): robots/lawnMower + home2056/mowerDock, robots/poolCleaner + home2056/poolCaddy,
// robots/windowCleaner + home2056/windowStation, robots/kitchenChef (2 arms on a ceiling rail), robots/solarCleaner (panel row + dock). Each station has 'plates' for 10 names.
// Render: python3 tools/render.py frames engine/props/showcase-lineup 1,4,7,10
import {studio, THREE, camKF} from '/engine/lib/core.js';
const st = await studio({look: 'hero', hook: ['הרובוט הבא', 'בבית <span class="pill">שלכם</span>'], hookEnd: 2.4, fog: .01, scenes: (A, B, E) => [0, E]});
const {scene} = st;
st.stage({r: 80, grid: 0, spot: [0, 9, 4], target: [0, .5, 0]});
const P = async (n, o = {}) => (await st.prop(n, {tint: 1, ...o})).object;
// placeholder plates only (never real names)
const names = (title) => (c, t, W, H) => { c.fillStyle = '#10123a'; c.fillRect(0, 0, W, H); c.fillStyle = '#8ea6ff'; c.font = `700 ${H * .16}px Rubik`; c.textAlign = 'center'; c.fillText(title, W / 2, H * .2);
  for (let i = 0; i < 10; i++) { const x = (i % 5) * W / 5 + W * .02, y = H * .3 + Math.floor(i / 5) * H * .34; c.fillStyle = i < 3 ? '#2a2f7a' : '#1a1d52'; st.rr(c, x, y, W / 5 - W * .04, H * .28, 10); c.fill();
    c.fillStyle = i < 3 ? '#d9ddf7' : '#4b50a0'; c.font = `500 ${H * .065}px Rubik`; c.fillText(i < 3 ? 'השם שלכם' : '—', x + W / 10 - W * .02, y + H * .18); } };
const plate = (o, title) => { const s = st.screen(o.getObjectByName('plates'), names(title)); return s; };
const S = [];
// 1) mower (x −6)
const mower = await P('robots/lawnMower', {x: -6.2, z: .9, ry: .5}); const md = await P('home2056/mowerDock', {x: -5.4, z: -.6, ry: -.3}); S.push(plate(md, 'מכסחת'));
// 2) pool cleaner on its caddy-side (x −2)
const pc = await P('robots/poolCleaner', {x: -1.7, z: 1.0, ry: -.6}); const cad = await P('home2056/poolCaddy', {x: -1.6, z: -.5, ry: -.2}); S.push(plate(cad, 'מנקה בריכה'));
// 3) kitchen chef (x 2)
const chef = await P('robots/kitchenChef', {x: 2.2, z: -.6}); S.push(plate(chef, 'שף'));
// 4) solar + window (x 7)
const sol = await P('robots/solarCleaner', {x: 7.5, z: -.2, ry: -.3}); S.push(plate(sol, 'מנקה פאנלים'));
const win = await P('robots/windowCleaner', {x: 5.0, y: 1.0, z: -1.3}); const ws = await P('home2056/windowStation', {x: 4.3, y: .2, z: -1.4}); S.push(plate(ws, 'מנקה חלונות'));
const glass = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.4, .03), new THREE.MeshStandardMaterial({color: 0xa9bcff, roughness: .08, transparent: true, opacity: .25})); glass.position.set(5.0, 1.2, -1.36); scene.add(glass);
const G = (o, n) => o.getObjectByName(n);
st.frame(t => {
  G(mower, 'blade').rotation.y = t * 30; G(mower, 'lidarHead').rotation.y = t * 4; G(mower, 'wheelL').rotation.x = G(mower, 'wheelR').rotation.x = t * 3;
  G(pc, 'brushF').rotation.x = G(pc, 'brushB').rotation.x = t * 8;
  const car = G(chef, 'carriage'); car.position.x = -.4 + .25 * Math.sin(t * .9); G(chef, 'R_j1').rotation.y = .4 * Math.sin(t * 1.3); G(chef, 'L_j2').rotation.x = .5 + .25 * Math.sin(t * 1.1); G(chef, 'pan').rotation.z = .05 * Math.sin(t * 6);
  G(sol, 'cleaner').position.x = -1.4 + 2.6 * (.5 + .5 * Math.sin(t * .6)); G(sol, 'brush').rotation.z = t * 10;
  G(win, 'pad').rotation.z = t * 6; win.position.x = 5.0 + .4 * Math.sin(t * .8); win.position.y = 1.0 + .5 * (.5 + .5 * Math.sin(t * .5));
  S.forEach(s => s.update(t));
  const [cp, ct] = camKF(t, [[0, [-3.6, 2.6, 4.8], [-5.8, .3, .3]], [2.6, [-3.8, 2.2, 4.2], [-5.9, .3, .2]], [3.4, [-.8, 2.2, 3.8], [-2.1, .4, .1]], [5.6, [-.9, 1.9, 3.3], [-2.2, .35, .1]], [6.4, [3.8, 2.6, 3.4], [2.0, 1.4, -.4]], [8.6, [3.6, 2.2, 2.8], [2.1, 1.3, -.4]], [9.4, [8.6, 3.6, 4.8], [6.6, .8, -.5]], [12, [9.0, 3.2, 4.2], [6.4, .9, -.6]]]);
  return {cp, ct, noFlash: true}; });
st.ready();
</script></body></html>
