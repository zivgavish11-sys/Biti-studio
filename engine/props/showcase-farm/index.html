<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-24 run 15 — orchard + tethered fruit-picking drones (pro-v3 outdoor). Topic bank: "רובוטים בחקלאות: רחפן שקוטף פירות".
// Shots: wide over the rows (net hidden) → drone in front of the hero tree, arm picks an apple → ground unit with 4 tethers + bin → low row-level shot.
// Render: python3 tools/render.py frames engine/props/showcase-farm 1,4.5,7,10
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, sm, camPath, V} from '/engine/lib/core.js';
import {orchardTrees, droneTether, pickApple, spinProps} from '/engine/props/fx-farm.js';
const st = await studio({look: 'hero', fog: .001, hook: ['רחפן', 'שקוטף <span class="pill">תפוחים</span>'], hookEnd: 2.4, keys: ['תפוחים', 'בשל', 'כבל'], scenes: (A, B, E) => [0, E]});
const {scene} = st;
const M = async n => { const o = (await st.model(n)).object; scene.add(o); return o; };
const W3 = o => o.getWorldPosition(new THREE.Vector3());
const orch = await M('farm/orchard'); orch.getObjectByName('hailNet').visible = false; orch.updateMatrixWorld(true);
await orchardTrees(st, orch);
const S = n => W3(orch.getObjectByName(n));
const unit = await M('farm/groundUnit'); unit.position.copy(S('alleySpot')); unit.position.x = -.5;
const hero = orch.getObjectByName('heroTree10');
const drones = [], tethers = [], targets = [], base = [];
for (let i = 0; i < 4; i++) {
  const d = await M('farm/pickerDrone'); drones.push(d);
  const ap = hero.getObjectByName('pick' + [3, 6, 1, 9][i]) || hero.getObjectByName('pick0');
  const p = i === 0 ? W3(ap) : V([0, -3.4, 2.3, -6.2][i], 1.5 + (i % 2) * .9, .35);   // drone 0 works the hero tree, others the neighbours
  d.position.set(p.x, p.y, p.z + .95); d.rotation.y = Math.PI;               // faces −z (toward the row)
  base.push(d.position.clone()); targets.push(ap);
}
scene.updateMatrixWorld(true);
drones.forEach((d, i) => tethers.push(droneTether(scene, unit.getObjectByName('tether' + i), d, {sag: .5})));
const scr = st.screen(unit.getObjectByName('screen'), (c, t, Wd, H) => { c.fillStyle = '#0e1418'; c.fillRect(0, 0, Wd, H); c.fillStyle = '#8ea6ff'; c.font = `700 ${H * .3}px Rubik`; c.textAlign = 'center'; c.fillText('נקטפו ' + (412 + Math.floor(t * 3)), Wd / 2, H * .45); c.fillStyle = '#e9eaec'; c.font = `400 ${H * .2}px Rubik`; c.fillText('4 רחפנים פעילים', Wd / 2, H * .78); }, {light: .5});
const PL = await proLook(st, {mode: 'outdoor', robots: [], people: [], focus: V(0, 1, 0), sun: [-.5, .75, .45], exposure: .6, env: .26, fill: .22, sunI: 2.8});
st.frame(t => {
  drones.forEach((d, i) => { spinProps(d, t + i, base[i]); if (i === 0) { d.position.z = base[i].z; pickApple(d, targets[i], sm(3.6, 7.0, t)); } else d.position.x = base[i].x + Math.sin(t * .5 + i) * .15; });
  tethers.forEach(x => x.update()); scr.update(t);
  const h = W3(targets[0]);
  const [cp, ct] = camPath(t, [
    [0, [9, 14, 16], [0, 0, 0]], [2.6, [5, 6, 9], [0, 1.4, 0]],
    [3.6, [h.x + 1.6, h.y + .4, h.z + 2.9], [h.x, h.y, h.z + .5]], [7.0, [h.x - 1.2, h.y + .25, h.z + 2.7], [h.x, h.y, h.z + .5]],
    [8.0, [4.6, 3.6, 2.9], [-.8, .9, 1.4]], [9.8, [3.6, 3.3, 3.0], [-.8, .9, 1.4]], [10.4, [-4.8, 1.8, 2.6], [.5, 1.3, .8]], [12, [-6, 1.2, 2.4], [2, 1.5, .4]]]);
  PL.update(t, ct);
  return {cp, ct, noFlash: true};
});
st.ready();
</script></body></html>
