<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-25 — ep027-chores kit demo (pro-v3 daylight, ep026 kitchen as a stand-in room).
// t 1 dock self-empties (dust into the bag) · t 3 twist: arm lifts the sock (Biti curious) · t 5 sock slips · t 7 ✗ spots (dishwasher, pan, shirt) + teleoperator + border line + tags.
// Render: python3 tools/render.py frames engine/props/showcase-chores 1,3,5,7
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, V, sm} from '/engine/lib/core.js';
import {spinVac, sockPick, dockEmpty, borderLine, tagCard} from '/engine/props/fx-chores.js';
import {orbRig} from '/engine/props/fx-biti.js';
const st = await studio({look: 'hero', fog: .001, hook: [], hookEnd: 0, scenes: (A, B, E) => [0, E]});
const {scene} = st;
const M = async n => { const o = (await st.model(n)).object; scene.add(o); return o; };
const S = (o, n) => o.getObjectByName(n).getWorldPosition(new THREE.Vector3());
const room = await M('buildings/kitchenLiving'); room.updateMatrixWorld(true);
const dock = await M('robots/vacuumDockPro'); dock.position.set(-.15, 0, -2.55);
const vac = await M('robots/vacuumPro'); vac.position.set(-.15, .022, -2.42); vac.rotation.y = Math.PI;
const vac2 = await M('robots/vacuumPro'); vac2.position.set(.6, 0, .3); vac2.rotation.y = -.6;
const sock = await M('everyday/sock'); sock.position.set(.36, 0, .66); sock.rotation.y = .5;
const shirt = await M('everyday/tshirtCrumpled'); shirt.position.set(2.0, .43, .45); shirt.rotation.y = .4;
const dw = await M('home/dishwasherOpen'); dw.position.set(-2.88, 0, -1.0); dw.rotation.y = Math.PI / 2;
const pan = await M('home/panSkillet'); pan.position.set(-3.17, .912, -.45);
const op = await M('people/mannequin-teleop'); op.position.set(2.6, 0, -1.9); op.rotation.y = -.9;
const orb = await M('robots/bitiOrb'); orb.position.set(.15, .75, .9); orb.rotation.y = -.4;
scene.updateMatrixWorld(true);
const pick = sockPick(vac2, sock), emp = dockEmpty(scene, dock, vac), line = borderLine(scene, [-1.5, 0, -.4], [1.5, 0, -.4], {to: [-1.5, 0, -1.6]}), rig = orbRig(st, orb);
const tags = [['כביסה', [2.0, .9, .45]], ['מדיח', [-2.6, 1.0, -1.0]], ['בישול', [-3.0, 1.4, -.45]]].map(([w, p]) => { const s = st.screen([.5, .17], (c, t, W, H) => tagCard(c, t, W, H, {ok: false, text: w}), {light: .5}); s.mesh.position.set(...p); scene.add(s.mesh); return s; });
const PL = await proLook(st, {mode: 'outdoor', robots: [vac, vac2, dock], people: [op], focus: V(0, .5, 0), sun: [.45, .8, .55], haze: 0xe8e0d4, exposure: .3, env: .16, fill: .1, sunI: 2.2});
st.frame(t => {
  spinVac(vac, t, {mop: 1}); emp.update(t, t < 2 ? sm(.2, 1.8, t) : 0);
  pick.update(t < 2 ? 0 : t < 4 ? sm(2, 3.1, t) : 1, {slip: t > 4 ? sm(4.2, 5.3, t) : 0}); line.set(t > 6 ? sm(6.2, 7, t) : 0);
  tags.forEach(s => { s.update(t); s.mesh.visible = t > 6; s.mesh.lookAt(st.cam.position); });
  rig.update(t, {mood: t < 4 ? 'curious' : t < 6 ? 'surprise' : 'think', point: t > 2 && t < 4 ? 1 : 0, look: [.6, -.3]});
  const shots = [[[.45, .6, -1.55], [-.15, .2, -2.45]], [[1.3, .6, 1.35], [.5, .2, .45]], [[1.3, .6, 1.35], [.5, .2, .45]], [[-.6, 1.7, 1.3], [-2.7, .8, -.8]]];
  const [cp, ct] = shots[Math.min(3, Math.floor((t - .5) / 2))]; PL.update(t, V(...ct));
  return {cp: V(...cp), ct: V(...ct), noFlash: true, fov: 50};
});
st.ready();
</script></body></html>
