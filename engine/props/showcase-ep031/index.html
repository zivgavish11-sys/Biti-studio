<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="importmap">{"imports":{"three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Media pro 2026-11-27 run 19 — ep031 kit check: t 1 = frame0 (bedroom, AC flap open + cold air, device far in the kitchen) · t 2 = high wide (command line device → AC)
// t 3 = device on the island + app cloud · t 4 = night alert (floor paths to the open mamad) · t 5 = fridge open, milk spot empty · t 6 = Shabbat table
// Render: python3 tools/render.py frames engine/props/showcase-ep031 1,2,3,4,5,6
import {proLook} from '/engine/lib/look-pro.js';
import {studio, THREE, V} from '/engine/lib/core.js';
import {commandLine, coldAir, appCloud, floorPaths, hubRims} from '/engine/props/fx-ep031.js';
const st = await studio({look: 'hero', fog: .001, hook: [], hookEnd: 0, scenes: (A, B, E) => [0, E]});
const {scene, cam: camera} = st;
const M = async (n) => { const o = (await st.model(n)).object; scene.add(o); return o; };
const S = (o, n) => o.getObjectByName(n).getWorldPosition(new THREE.Vector3());
const apt = await M('buildings/apartment31'); apt.updateMatrixWorld(true);
const hub = await M('everyday/homeHub'); hub.position.copy(S(apt, 'deviceSpot')); hub.scale.setScalar(1.6); hub.updateMatrixWorld(true);
const man = await M('people/mannequin-sit'); man.position.copy(S(apt, 'sofaSpot'));
const milk = await M('everyday/milkCarton'); milk.position.copy(S(apt, 'fridgeSpot')).add(V(-.5, .9, .3)); milk.position.y = .9; milk.position.x = 6.0;
scene.updateMatrixWorld(true);
const rims = hubRims(hub);
const line = commandLine(scene, S(hub, 'voiceSpot'), S(apt, 'airOut'), {lift: 1.4});
const air = coldAir(scene, S(apt, 'airOut'));
const apps = appCloud(scene, S(apt, 'deviceSpot').add(V(0, .75, .2)), {size: .2});
const paths = floorPaths(scene, [[S(apt, 'bedSpot').add(V(.9, 0, .6)), S(apt, 'hallSpot').add(V(-.5, 0, 0)), S(apt, 'hallSpot').add(V(.6, 0, 0)), S(apt, 'mamadSpot')], [S(apt, 'kidSpot').add(V(.6, 0, -.6)), S(apt, 'hallSpot'), S(apt, 'mamadSpot').add(V(.3, 0, .2))]]);
const PL = await proLook(st, {mode: 'studio', preset: 'warm', robots: [], people: [man], focus: V(0, 1, 0), exposure: .62});
st.frame(t => {
  const sh = Math.floor(t + .001);
  apt.getObjectByName('flap').rotation.x = sh === 1 ? -1.0 : 0; air.update(t, sh === 1 ? 1 : 0);
  line.set(sh === 2 ? 1 : 0); line.bead(sh === 2 ? .55 : null);
  rims.set(sh <= 3 ? 1 : sh === 4 ? 1 : 0, t, {full: sh === 4 ? 1 : 0});
  if (sh === 3) { apps.scatter(1, t); apps.face(camera); } else apps.scatter(0);
  paths.set(sh === 4 ? 1 : 0); paths.march(t);
  apt.getObjectByName('mamad').getObjectByName('leaf').rotation.y = sh === 4 ? -1.3 : 0;
  apt.getObjectByName('fridge').getObjectByName('door').rotation.y = sh === 5 ? 1.7 : 0;
  const v = [null, [[-6.4, 1.5, 2.4], [-5.2, 1.6, -2.5]], [[1.0, 8.5, 10], [0, 0, -.6]], [[4.4, 1.55, 1.3], [4.75, 1.4, -.55]], [[-.4, 3.6, 5.2], [-2.0, .2, -1.6]], [[5.4, 1.4, -.9], [6.6, 1.1, -3.6]], [[1.9, 1.5, 2.1], [.9, .8, .1]]][Math.min(6, Math.max(1, sh))];
  PL.update(t, V(...v[1])); return {cp: V(...v[0]), ct: V(...v[1]), noFlash: true, fov: 50};
});
st.ready();
</script></body></html>
