<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- FAQ / Q&A carousel (2D, brand colours). /engine/news/faq.html?spec=/path/spec.json&i=0&style=cards|chat|light
     spec: {slides:[{type:'cover'|'qa'|'follow', title, q, a, bullets}]} -->
<style>
@font-face{font-family:Rubik;src:url(/engine/assets/fonts/Rubik_400Regular.ttf);font-weight:400}
@font-face{font-family:Rubik;src:url(/engine/assets/fonts/Rubik_700Bold.ttf);font-weight:700}
:root{--cyan:#2ee6ff;--pink:#ff5fd2;--orange:#ffa53a;--purple:#6b5cff;--navy:#05061a;--navy2:#10123a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:Rubik,sans-serif}
.pg{position:absolute;inset:0;overflow:hidden}
.top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px}
.brand img{width:64px;height:64px;border-radius:50%}
.badge{font-size:30px;font-weight:700;padding:8px 24px;border-radius:30px}
.handle{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);font-size:36px;font-weight:700;padding:16px 44px;border-radius:50px;direction:ltr;white-space:nowrap;z-index:3}
.swipe{position:absolute;bottom:34px;left:72px;font-size:26px;font-weight:700;z-index:3}

/* ---------- A: cards (like the reference, brand colours) ---------- */
.cards{background:var(--navy);color:#fff}
.cards .blob{position:absolute;border-radius:50%;filter:blur(0);opacity:.9}
.cards .w1{width:900px;height:900px;right:-420px;top:-480px;background:radial-gradient(circle at 40% 60%,#6b5cff 0,#3a2fae 45%,transparent 70%)}
.cards .w2{width:800px;height:800px;left:-420px;bottom:-420px;background:radial-gradient(circle at 60% 40%,#ff5fd2 0,#8e2f86 40%,transparent 70%)}
.cards .line{position:absolute;inset:0}
.cards .hd{position:absolute;top:170px;width:100%;text-align:center;font-weight:700;font-size:160px;letter-spacing:2px;direction:ltr;color:#fff}
.cards .hd b{color:var(--cyan)}
.cards .stack{position:absolute;top:400px;bottom:150px;left:110px;right:110px;display:flex;flex-direction:column;justify-content:center;gap:80px}
.cards .box{position:relative;border-radius:36px;padding:72px 56px 60px;text-align:center;font-weight:700;line-height:1.35}
.cards .q{background:#171a4a;border:3px solid rgba(46,230,255,.5);box-shadow:0 14px 0 rgba(46,230,255,.18);font-size:62px}
.cards .a{background:#f2f4ff;color:var(--navy);box-shadow:0 14px 0 rgba(255,95,210,.35);font-size:42px;font-weight:400;line-height:1.45}
.cards .lab{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:700;padding:10px 44px;border-radius:24px}
.cards .q .lab{background:var(--cyan);color:var(--navy)}
.cards .a .lab{background:var(--pink);color:#fff}
.cards .badge{background:rgba(255,255,255,.12);color:#fff}
.cards .handle{background:#fff;color:var(--navy)}
.cards .swipe{color:var(--cyan);left:auto;right:72px}
.cards .ct{top:430px;font-size:130px}.cards.t-follow .ct{top:420px;font-size:110px}.cards.t-follow .cs{top:720px}.cards .cl{top:660px}.cards .cl li{font-size:48px}.cards .cs{font-size:46px}

/* ---------- B: chat (DM conversation) ---------- */
.chat{background:linear-gradient(180deg,#0b0d2e,#05061a);color:#fff}
.chat .hd{position:absolute;top:180px;right:72px;left:72px;font-weight:700;font-size:84px;line-height:1.1}
.chat .hd span{color:var(--cyan)}
.chat .row{position:absolute;left:72px;right:72px;display:flex;gap:20px;align-items:flex-end}
.chat .av{width:84px;height:84px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.chat .av img{width:84px;height:84px;border-radius:50%}
.chat .bub{border-radius:44px;padding:40px 46px;font-size:40px;line-height:1.42}
.chat .rq{top:420px;flex-direction:row}
.chat .rq .av{background:#2a2d63;color:#9aa3ff}
.chat .rq .bub{background:#1d2052;border-bottom-right-radius:10px;font-weight:700;font-size:50px}
.chat .ra{flex-direction:row-reverse}
.chat .ra .bub{background:linear-gradient(135deg,var(--purple),var(--pink));border-bottom-left-radius:10px}
.chat .who{font-size:26px;color:#8b93c9;margin:0 108px 10px;font-weight:700}
.chat .badge{background:rgba(46,230,255,.14);border:2px solid var(--cyan);color:var(--cyan)}
.chat .handle{background:linear-gradient(90deg,var(--cyan),var(--purple));color:#fff}
.chat .swipe{color:var(--cyan)}

/* ---------- C: light & clean ---------- */
.light{background:#f5f6ff;color:var(--navy)}
.light .strip{position:absolute;top:0;left:0;right:0;height:18px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink))}
.light .big{position:absolute;top:150px;left:30px;font-size:560px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:6px rgba(107,92,255,.18);direction:ltr}
.light .num{position:absolute;top:220px;right:72px;font-size:34px;font-weight:700;color:#fff;background:var(--pink);padding:8px 26px;border-radius:30px}
.light .qq{position:absolute;top:320px;right:72px;left:72px;font-size:88px;font-weight:700;line-height:1.12}
.light .qq span{background:linear-gradient(transparent 60%,rgba(46,230,255,.55) 60%)}
.light .bar{position:absolute;top:640px;right:72px;width:140px;height:10px;border-radius:6px;background:var(--purple)}
.light .aa{position:absolute;top:700px;right:72px;left:72px;font-size:44px;line-height:1.5;color:#2b2f5c}
.light .brand{color:var(--navy)}
.light .badge{background:var(--navy);color:#fff}
.light .handle{background:var(--navy);color:#fff}
.light .swipe{color:var(--purple)}

/* cover / follow (shared) */
.ct{position:absolute;top:330px;left:72px;right:72px;text-align:center;font-weight:700;font-size:110px;line-height:1.1}
.cs{position:absolute;top:640px;left:110px;right:110px;font-size:42px;line-height:1.5;text-align:center}
.cl{list-style:none;position:absolute;top:640px;left:120px;right:120px}
.cl li{font-size:42px;line-height:1.35;margin:26px 0;padding-right:56px;position:relative}
.cl li:before{content:"?";position:absolute;right:0;top:2px;width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="pg" class="pg"></div>
<script>
(async () => {
const q = new URLSearchParams(location.search);
const spec = await (await fetch(q.get('spec'))).json();
const i = +(q.get('i') || 0), st = q.get('style') || 'cards', S = spec.slides[i], N = spec.slides.length;
const nQ = spec.slides.filter(s => s.type === 'qa').length, k = spec.slides.slice(0, i + 1).filter(s => s.type === 'qa').length;
const pg = document.getElementById('pg'); pg.className = 'pg ' + st + ' t-' + S.type;
const logo = '/engine/assets/logo.jpg';
let h = `<div class="top"><div class="brand"><img src="${logo}">Robotics Israel</div>${S.type === 'qa' ? `<div class="badge">${k}/${nQ}</div>` : `<div class="badge">שאלות ותשובות</div>`}</div>`;
if (st === 'cards') h += `<div class="blob w1"></div><div class="blob w2"></div>
  <svg class="line" viewBox="0 0 1080 1350"><path d="M-20 300 C 200 260, 260 60, 520 -20" stroke="rgba(255,255,255,.35)" stroke-width="4" fill="none"/>
  <path d="M1100 1080 C 900 1120, 860 1300, 640 1380" stroke="rgba(255,255,255,.35)" stroke-width="4" fill="none"/></svg>`;
if (st === 'light') h += `<div class="strip"></div>`;
if (S.type === 'qa') {
  if (st === 'cards') h += `<div class="hd">Q<b>&amp;</b>A</div><div class="stack"><div class="box q"><div class="lab">שאלה</div>${S.q}</div><div class="box a"><div class="lab">תשובה</div>${S.a}</div></div>`;
  if (st === 'chat') h += `<div class="hd">שאלתם,<br><span>ענינו</span></div>
    <div class="row rq"><div class="av">?</div><div class="bub">${S.q}</div></div>
    <div class="row ra" style="top:${S.aTop || 640}px"><div class="av"><img src="${logo}"></div><div class="bub">${S.a}</div></div>`;
  if (st === 'light') h += `<div class="big">?</div><div class="num">שאלה ${k}</div><div class="qq"><span>${S.q}</span></div><div class="bar"></div><div class="aa">${S.a}</div>`;
} else if (S.type === 'cover') {
  if (st === 'cards') h += `<div class="hd">Q<b>&amp;</b>A</div>`;
  h += `<div class="ct">${S.title}</div><ul class="cl">${(S.bullets || []).map(b => `<li>${b}</li>`).join('')}</ul>`;
} else {
  h += `<div class="ct">${S.title}</div><div class="cs">${S.text || ''}</div>`;
}
h += S.type === 'follow' ? `<div class="handle">@robotics.israel</div>` : `<div class="swipe">החליקו →</div>`;
pg.innerHTML = h;
await document.fonts.ready; await new Promise(r => setTimeout(r, 200)); window.ready = true;
})();
</script></body></html>
